    return `<div class="card narrow center-card"><h1>アクセスできません<small>Chưa vào được</small></h1><p>${h(reason)}</p>
      <table class="detail"><tr><th>メール<small>Email</small></th><td>${h(S.auth.email)}</td></tr></table>
      <div class="actions"><a class="btn" href="#/setup">初期設定（管理者のみ）/ Thiết lập (quản trị)</a> <button class="btn primary" data-act="logout">ログアウト / Đăng xuất</button></div></div>`;
  },

  list(r) {
    const admin = isAdmin();
    if (admin && r.q.get('tab') === 'trash') return V.trash(r);
    const f = listFilter(r.q);
    const counts = {};
    filterApps({ ...f, status: '' }).forEach((a) => { counts[a.state.status] = (counts[a.state.status] || 0) + 1; });
    const rows = filterApps(f);
    const stats = STATUSES.map(([k, jp, vi, cls]) => `<a class="stat ${cls}${f.status === k ? ' on' : ''}" href="#/${qs({ ...f, status: f.status === k ? '' : k })}"><b>${h(counts[k] || 0)}</b>${h(jp)}<small>${h(vi)}</small></a>`).join('');
    const body = rows.map((a) => {
      const s = a.state;
      const un = unreadCount(threadMsgs('app', a.owner, a.id), threadKey('app', a.owner, a.id));
      const u = S.users[a.owner] || {};
      return `<tr data-href="#/apps/${h(a.owner)}/${h(a.id)}">
        <td><b>${h(s.app_no)}</b>${a.ctv ? ` <span class="badge st-partner" title="${h('CTV: ' + a.ctv.name)}">CTV</span>` : ''}<small>${h(s.applied_at)}</small></td>
        <td>${catBadge(a.form.category)}</td>
        <td class="wrapcell">${h(a.form.product_label)}</td>
        <td>${h(a.form.cust_name)}<small>${h(meigiLabel(a.form.meigi_type))}</small></td>
        ${admin ? `<td>${h(u.name || '—')}<small>${h((ROLE[u.role] || {}).jp || '')}</small></td>` : ''}
        <td>${statusBadge(s.status)}${s.status === 'incomplete' ? '<small class="warn">要対応 · cần bổ sung</small>' : ''}</td>
        <td class="num">${DONE_LIKE.includes(s.status) ? (s.reward_pending ? '<span class="hint">未確定</span>' : h(yen(s.reward_amount))) : '<span class="hint">—</span>'}${s.started_at ? `<small>開通 ${h(s.started_at)}</small>` : ''}</td>
        <td class="num">${un ? `<span class="badge unread">${un}</span>` : ''}</td>
        ${admin ? `<td class="num">${DONE_LIKE.includes(s.status) ? '<span class="hint" title="完了済みの申込は削除できません。先に「キャンセル」へ変更してください / Đơn đã Hoàn tất không xoá được — đổi sang キャンセル trước">🔒</span>' : `<button type="button" class="btn small" data-act="appDelete" data-owner="${h(a.owner)}" data-id="${h(a.id)}" data-confirm2 title="削除 / Xoá đơn">🗑</button>`}</td>` : ''}</tr>`;
    }).join('');
    const opt = (o) => `<option value="${h(o.id)}"${f.owner === o.id ? ' selected' : ''}>${h(o.name)} (${h((ROLE[o.role] || {}).jp)})</option>`;
    const archived = admin ? Object.entries(S.users).filter(([, u]) => u.role !== 'kanri' && u.active === false).map(([id, u]) => ({ id, ...u })).sort((a, b) => String(a.name).localeCompare(b.name)) : [];
    const owners = admin ? `<select name="owner"><option value="">担当者：全員 / Tất cả người gửi</option><optgroup label="有効 / Đang dùng">${ownerChoices().map(opt).join('')}</optgroup>${archived.length ? `<optgroup label="停止中（アーカイブ）/ Đã khoá">${archived.map(opt).join('')}</optgroup>` : ''}</select>` : '';
    return `<div class="head"><h1>申込一覧<small>${admin ? 'Tất cả đơn' : 'Danh sách đơn đã gửi'}</small></h1><a class="btn primary" href="#/apply">＋ 新規申込 / Đăng ký mới</a></div>
      ${admin ? listTabs('live') : ''}<div class="stats">${stats}</div>
      <form class="card filters" data-action="filter">
        <input type="hidden" name="status" value="${h(f.status)}">
        <select name="cat"><option value="">種別：すべて / Tất cả loại</option>${Object.entries(CATEGORIES).map(([k, c]) => `<option value="${k}"${f.cat === k ? ' selected' : ''}>${c.icon} ${h(c.jp)} / ${h(c.vi)}</option>`).join('')}</select>
        <input type="month" name="month" value="${h(f.month)}" title="申込月 / Tháng gửi đơn">
        ${owners}
        <input type="search" name="q" value="${h(f.q)}" placeholder="申込番号・お客様名・電話 / Mã đơn, tên KH, SĐT">
        <button class="btn">検索 / Lọc</button>
        ${f.status || f.cat || f.month || f.q || f.owner ? '<a class="btn" href="#/">クリア / Xoá lọc</a>' : ''}
      </form>
      <div class="btns exportbar"><span class="hint">${rows.length} 件</span><button type="button" class="btn small" data-act="xlsxApps" data-filter="${h(JSON.stringify(f))}">⬇ Excel</button><button type="button" class="btn small" data-act="pdfApps" data-filter="${h(JSON.stringify(f))}">⬇ PDF</button>${admin ? `<button type="button" class="btn small" data-act="csvApps" data-filter="${h(JSON.stringify(f))}">⬇ CSV</button>` : ''}</div>
      ${rows.length ? `<div class="tablewrap"><table class="list"><thead><tr><th>申込番号<small>Mã đơn / ngày</small></th><th>種別<small>Loại</small></th><th>商材<small>Gói</small></th><th>お客様<small>Khách hàng</small></th>${admin ? '<th>担当<small>Người gửi</small></th>' : ''}<th>状態<small>Trạng thái</small></th><th>報酬<small>Hoa hồng</small></th><th>💬</th>${admin ? '<th>削除<small>Xoá</small></th>' : ''}</tr></thead><tbody>${body}</tbody></table></div>` : '<div class="empty">申込はまだありません / Chưa có đơn nào.</div>'}`;
  },

  // Đơn đã xoá (chỉ quản trị): lưu trữ, xem lại, khôi phục
  trash() {
    const rows = trashList();
    const body = rows.map((a) => {
      const s = a.state;
      const u = S.users[a.owner] || {};
      return `<tr data-href="#/apps/${h(a.owner)}/${h(a.id)}" class="archived">
        <td><b>${h(s.app_no)}</b><small>${h(s.applied_at)}</small></td>
        <td>${catBadge(a.form.category)}</td>
        <td class="wrapcell">${h(a.form.product_label)}</td>
        <td>${h(a.form.cust_name)}<small>${h(meigiLabel(a.form.meigi_type))}</small></td>
        <td>${h(u.name || '—')}<small>${h((ROLE[u.role] || {}).jp || '')}</small></td>
        <td>${statusBadge(s.status)}</td>
        <td>${h(fmtTime(a.trashed.at))}<small>${h(a.trashed.name || userName(a.trashed.by))}</small></td>
        <td class="num"><button type="button" class="btn small" data-act="appRestore" data-owner="${h(a.owner)}" data-id="${h(a.id)}">↩ 復元<small>Khôi phục</small></button></td></tr>`;
    }).join('');
    return `<div class="head"><h1>申込一覧<small>Tất cả đơn</small></h1><a class="btn primary" href="#/apply">＋ 新規申込 / Đăng ký mới</a></div>
      ${listTabs('trash')}
      ${rows.length ? `<div class="tablewrap"><table class="list" id="trashTable"><thead><tr><th>申込番号<small>Mã đơn / ngày</small></th><th>種別<small>Loại</small></th><th>商材<small>Gói</small></th><th>お客様<small>Khách hàng</small></th><th>担当<small>Người gửi</small></th><th>削除前の状態<small>Trạng thái lúc xoá</small></th><th>削除日時<small>Xoá lúc · người xoá</small></th><th></th></tr></thead><tbody>${body}</tbody></table></div>` : '<div class="empty">削除された申込はありません / Chưa có đơn nào bị xoá.</div>'}
      <p class="hint">削除した申込はここに保管されます（完全削除はありません）。「復元」で元の一覧に戻り、状態・履歴・チャットもそのまま戻ります。報酬集計や担当者の画面には、削除中は表示されません。<br>Đơn đã xoá được giữ lại mãi tại đây. Bấm 復元 để đưa về danh sách cũ (giữ nguyên trạng thái, lịch sử, chat). Trong lúc ở mục này, đơn không tính vào 報酬集計 và người gửi không thấy.</p>`;
  },

  apply(a, r, ctv) {
    const admin = isAdmin() && !ctv;
    const editing = !!a;
    const d = editing ? { ...a.form, consent: true } : (S.draft || { category: CATEGORIES[r.q.get('cat')] ? r.q.get('cat') : '' });
    const cat = d.category || '';
    const list = catalogList(ctv ? ctv.catalog : null).filter((p) => p.active || (editing && p.code === a.form.product));
    const groups = {};
    list.forEach((p) => { (groups[p.provider] = groups[p.provider] || []).push(p); });
    const opts = Object.entries(groups).map(([prov, ps]) => `<optgroup label="${h(prov)}" data-cat="${h(ps[0].category)}">${ps.map((p) => `<option value="${h(p.code)}" data-cat="${h(p.category)}" data-op="${p.has_op ? 1 : 0}" data-meigi="${h(allowedMeigi(p).join(','))}" data-ngvn="${p.ng_vn ? 1 : 0}" data-cond="${h(p.conditions || '')}"${d.product === p.code ? ' selected' : ''}>${h(p.provider)} · ${h(p.meigi)} · ${h(p.plan)}</option>`).join('')}</optgroup>`).join('');
    const det = (k) => DETAIL_FIELDS[k].map(([name, jp, vi, type, ol]) => {
      const v = cat === k ? ((d.details || {})[name] || '') : '';
      const fn = `d_${k}_${name}`;
      if (type === 'select') return `<label class="field"><span>${h(jp)}<small>${h(vi)}</small></span><select name="${fn}">${ol.map(([ov, l]) => `<option value="${h(ov)}"${v === ov ? ' selected' : ''}>${h(l)}</option>`).join('')}</select></label>`;
      return `<label class="field"><span>${h(jp)}<small>${h(vi)}</small></span><input name="${fn}" type="${type === 'date' ? 'date' : 'text'}" value="${h(v)}"></label>`;
    }).join('');
    const ctvBox = ctv ? `<h2>0. 送信者（CTV）<small>Người gửi đơn</small></h2><div class="grid">
          <label class="field"><span>お名前 <em>*</em><small>Tên của bạn (CTV)</small></span><input name="ctv_name" value="${h(d.ctv_name || '')}" maxlength="60" autocomplete="name"></label>
          <label class="field"><span>電話番号<small>SĐT của bạn (không bắt buộc)</small></span><input name="ctv_phone" value="${h(d.ctv_phone || '')}" maxlength="30" inputmode="tel" autocomplete="tel"></label></div>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">` : '';
    return `${ctv ? '' : `<div class="head"><h1>${editing ? `申込修正<small>Sửa đơn ${h(a.state.app_no)}</small>` : '新規申込<small>Đăng ký mới</small>'}</h1><a class="btn" href="${editing ? `#/apps/${h(a.owner)}/${h(a.id)}` : '#/'}">← 戻る / Quay lại</a></div>`}
      <form class="card form apply" id="applyform" data-action="${ctv ? 'ctvApply' : editing ? 'editApp' : 'apply'}" data-keep ${editing ? `data-owner="${h(a.owner)}" data-id="${h(a.id)}"` : ''} novalidate>
        ${ctvBox}
        ${admin && !editing ? `<h2>担当者<small>Đơn này tính cho ai</small></h2><label class="field"><span>担当者 <em>*</em><small>Nhân viên / đối tác được tính hoa hồng</small></span><select name="owner_id" required><option value="">— 選択 / Chọn —</option>${ownerChoices().map((o) => `<option value="${h(o.id)}"${d.owner_id === o.id ? ' selected' : ''}>${h(o.name)} (${h((ROLE[o.role] || {}).jp)})</option>`).join('')}</select></label>` : ''}
        <h2>1. 種別<small>Loại dịch vụ</small></h2>
        <div class="radios big cats">${Object.entries(CATEGORIES).map(([k, c]) => `<label><input type="radio" name="category" value="${k}"${cat === k ? ' checked' : ''}><span class="ico">${c.icon}</span> ${h(c.jp)}<small>${h(c.vi)}</small></label>`).join('')}</div>
        <h2>2. 商材・プラン<small>Gói dịch vụ</small></h2>
        <label class="field"><span>商材 <em>*</em><small>Nhà cung cấp · danh nghĩa · gói</small></span><select name="product" id="product"><option value="">— 商材を選択 / Chọn gói —</option>${opts}</select></label>
        <p class="hint warn" id="noprod" hidden>この種別の商材はまだ登録されていません（管理者が「手数料表」で追加）。<br>Loại này chưa có gói nào — quản trị thêm ở 手数料表 → 商材追加.</p>
        <div class="cond" id="cond" hidden></div>
        <div class="field" id="opfield" hidden><span>レ点オプション<small>Khách có đăng ký gói OP không?</small></span>
          <div class="radios"><label><input type="radio" name="op_taken" value="1"${d.op_taken === true ? ' checked' : ''}> 加入する<small>Có</small></label><label><input type="radio" name="op_taken" value="0"${d.op_taken === false ? ' checked' : ''}> 加入しない<small>Không</small></label></div></div>
        <label class="consent ngvn" id="ngvnfield" hidden><input type="checkbox" name="not_vn" value="1"${d.not_vn ? ' checked' : ''}> <b>お客様はベトナム国籍ではありません</b>（この商材はベトナム国籍の方の取次NG）<small>Tôi xác nhận KH KHÔNG phải quốc tịch Việt Nam — gói này không nhận KH người Việt.</small></label>
        <h2>3. 名義<small>Danh nghĩa hợp đồng</small></h2>
        <div class="radios" id="meigi">${Object.entries(MEIGI).map(([k, m]) => `<label><input type="radio" name="meigi_type" value="${k}"${d.meigi_type === k ? ' checked' : ''}> ${h(m.jp)}<small>${h(m.vi)}</small></label>`).join('')}</div>
        <p class="hint warn" id="meigiwarn" hidden>選択した名義はこの商材の対象外です / Danh nghĩa này không áp dụng cho gói đã chọn</p>
        <h2>4. お客様情報<small>Thông tin khách hàng</small></h2>
        <div class="grid">
          <label class="field"><span>契約者名 <em>*</em><small>Tên người ký hợp đồng</small></span><input name="cust_name" value="${h(d.cust_name || '')}"></label>
          <label class="field"><span>フリガナ<small>Phiên âm katakana</small></span><input name="cust_kana" value="${h(d.cust_kana || '')}"></label>
          <label class="field corp-only"><span>法人名<small>Tên công ty (nếu pháp nhân)</small></span><input name="company_name" value="${h(d.company_name || '')}"></label>
          <label class="field"><span>生年月日<small>Ngày sinh</small></span><input name="birth_date" type="date" value="${h(d.birth_date || '')}"></label>
          <label class="field"><span>電話番号 <em>*</em><small>Số điện thoại</small></span><input name="phone" value="${h(d.phone || '')}" inputmode="tel"></label>
          <label class="field"><span>メール<small>Email</small></span><input name="email" type="email" value="${h(d.email || '')}"></label>
          <label class="field"><span>郵便番号<small>Mã bưu điện (tự điền địa chỉ)</small></span><input name="postal" id="postal" value="${h(d.postal || '')}" inputmode="numeric" placeholder="1010047"></label>
          <label class="field"><span>住所 <em>*</em><small>Địa chỉ</small></span><input name="address" id="address" value="${h(d.address || '')}"></label>
          <label class="field"><span>建物名・部屋番号<small>Toà nhà · số phòng</small></span><input name="building" value="${h(d.building || '')}"></label>
        </div>
        ${Object.keys(CATEGORIES).map((k) => `<div class="catfields" data-for="${k}"${cat && cat !== k ? ' hidden' : ''}><h2>5. ${h(CATEGORIES[k].jp)}の情報<small>Thông tin ${h(CATEGORIES[k].vi)}</small></h2><div class="grid">${det(k)}</div></div>`).join('')}
        <label class="field"><span>備考<small>Ghi chú cho NASON</small></span><textarea name="note" rows="3">${h(d.note || '')}</textarea></label>
        <label class="consent"><input type="checkbox" name="consent" value="1"${d.consent ? ' checked' : ''}> お客様ご本人から申込と個人情報の提供について同意を得ています。<small>Tôi xác nhận đã được khách hàng đồng ý đăng ký và cung cấp thông tin cá nhân.</small></label>
        <div class="actions"><button class="btn primary">${editing ? '修正して保存 / Lưu & gửi lại' : '申込を送信 / Gửi đơn'}</button></div>
      </form>`;
  },

  detail(a) {
    const admin = isAdmin();
    const trashed = !!a.trashed; // đơn đã xoá: chỉ xem (quản trị)
    const s = a.state;
    const f = a.form;
    const cat = S.catalog[f.product] || {};
    const canEdit = !trashed && (admin || s.status === 'received' || s.status === 'incomplete');
    const rows = [['申込番号', 'Mã đơn', `<b>${h(s.app_no)}</b>`]];
    if (a.ctv) rows.push(['CTV経由', 'Đơn qua link CTV', `<span class="badge st-partner">CTV</span> ${h(a.ctv.name)}${a.ctv.phone ? `<small>${h(a.ctv.phone)}</small>` : ''}`]);
    rows.push(['種別', 'Loại', catBadge(f.category)], ['商材', 'Gói', h(f.product_label)]);
    if (f.op_taken === true || f.op_taken === false) rows.push(['レ点OP', 'Gói OP', f.op_taken ? '加入 / Có' : '加入なし / Không']);
    if (f.not_vn) rows.push(['国籍確認', 'Quốc tịch', 'ベトナム国籍ではないことを確認済 / Đã xác nhận KH không phải người Việt Nam']);
    rows.push(['名義', 'Danh nghĩa', h(meigiLabel(f.meigi_type))], ['契約者名', 'Tên KH', h(f.cust_name) + (f.cust_kana ? `<small>${h(f.cust_kana)}</small>` : '')]);
    if (f.company_name) rows.push(['法人名', 'Công ty', h(f.company_name)]);
    rows.push(['生年月日', 'Ngày sinh', h(f.birth_date || '—')], ['電話番号', 'Điện thoại', h(f.phone || '—')], ['メール', 'Email', h(f.email || '—')], ['住所', 'Địa chỉ', `${f.postal ? '〒' + h(f.postal) + ' ' : ''}${h(f.address || '')} ${h(f.building || '')}`]);
    for (const [name, jp, vi, type, ol] of DETAIL_FIELDS[f.category] || []) {
      let v = (f.details || {})[name];
      if (!v) continue;
      if (type === 'select') { const o = ol.find((x) => x[0] === v); v = o ? o[1] : v; }
      rows.push([jp, vi, h(v)]);
    }
    if (f.note) rows.push(['備考', 'Ghi chú', `<span class="pre">${h(f.note)}</span>`]);
    rows.push(['申込日', 'Ngày gửi', h(s.applied_at)]);
    if (s.started_at) rows.push(['開通・供給開始日', 'Ngày mở', `<b>${h(s.started_at)}</b>`]);
    if (s.cancelled_at) rows.push(['解約日', 'Ngày huỷ', h(s.cancelled_at)]);
    const hist = Object.values(a.history || {}).sort((x, y) => (x.at || 0) - (y.at || 0)).map((x) => `<li><time>${h(fmtTime(x.at))}</time>${x.from ? statusBadge(x.from) + ' → ' : ''}${x.to ? statusBadge(x.to) : ''} <span class="hint">${h(x.name || '')}</span>${x.comment ? `<div class="pre comment">${h(x.comment)}</div>` : ''}</li>`).join('') || '<li class="hint">—</li>';
    let reward = '<p class="hint">開通・供給開始（完了）後に計上されます。<br>Hoa hồng được tính khi đơn Hoàn tất (đã mở / bắt đầu cấp).</p>';
    if (DONE_LIKE.includes(s.status)) {
      reward = `<table class="detail"><tr><th>一時報酬<small>HH 1 lần</small></th><td class="big">${s.reward_pending ? '<span class="hint">未確定 / Chưa xác định</span>' : h(yen(s.reward_amount))}</td></tr>
        ${s.reward_stock ? `<tr><th>ストック/月<small>HH stock mỗi tháng</small></th><td>${h(yen(s.reward_stock))}</td></tr>` : ''}
        ${s.clawback_amount ? `<tr><th>戻入<small>Thu hồi</small></th><td class="neg">${h(yen(s.clawback_amount))}</td></tr>` : ''}
        <tr><th>計上月<small>Tháng tính HH</small></th><td>${h((s.started_at || '').slice(0, 7))}</td></tr></table>`;
    }
    let adminBox = '';
    if (admin) {
      const ownerRole = (S.users[a.owner] || {}).role;
      const fee = S.fees[f.product];
      const pv = computeReward(ownerRole, cat, fee, f.op_taken, S.settings, { company: a.actual_fee, partner: a.actual_partner });
      const company = a.company != null ? a.company : pv.company;
      const one = s.reward_amount != null ? s.reward_amount : pv.one;
      adminBox = `<div class="adminbox"><b>管理者のみ / Chỉ quản trị</b><table class="detail">
        ${isRangeFee(fee) ? `<tr><th>単価<small>Giá theo bảng</small></th><td>${h(feeText(fee))} <span class="badge st-processing">変動<small>Giá khoảng</small></span>${a.actual_fee == null ? '<br><small class="warn">完了時に実績額を入力 / Nhập số thực tế khi Hoàn tất</small>' : ''}</td></tr>` : ''}
        ${a.actual_fee != null ? `<tr><th>実績額<small>Số thực tế đã nhập</small></th><td>${h(yen(a.actual_fee))}</td></tr>` : ''}
        <tr><th>会社受取<small>Công ty thực nhận</small></th><td>${pv.needActual && a.company == null ? '<span class="hint">未入力</span>' : h(yen(company))}</td></tr>
        <tr><th>担当報酬<small>HH người gửi (${h((ROLE[ownerRole] || {}).vi || '')})</small></th><td>${pv.pending && s.reward_amount == null ? '<span class="warn">パートナー単価 未設定 / Chưa nhập giá đối tác</span>' : h(yen(one))}</td></tr>
        <tr><th>粗利<small>Công ty giữ lại</small></th><td>${h(yen(company - one))}</td></tr></table>
        ${DONE_LIKE.includes(s.status) && !trashed ? `<form data-action="recalc" data-confirm data-owner="${h(a.owner)}" data-id="${h(a.id)}" class="inline"><button class="btn small">↻ 現在の単価で再計算<small>Tính lại theo bảng giá hiện tại</small></button></form>` : ''}</div>`;
    }
    const statusForm = admin && !trashed ? `<div class="card"><h2>状態変更<small>Đổi trạng thái (quản trị)</small></h2>
      <form class="form" data-action="status" data-keep data-owner="${h(a.owner)}" data-id="${h(a.id)}">
        <label class="field"><span>状態<small>Trạng thái</small></span><select name="status" id="st">${STATUSES.map(([k, jp, vi]) => `<option value="${k}"${s.status === k ? ' selected' : ''}>${h(jp)} / ${h(vi)}</option>`).join('')}</select></label>
        <label class="field st-done-only"><span>開通・供給開始日<small>Ngày mở / bắt đầu cấp (bắt buộc khi Hoàn tất)</small></span><input type="date" name="started_at" value="${h(s.started_at || '')}"></label>
        <label class="field st-claw-only"><span>解約日<small>Ngày KH huỷ (bắt buộc khi Huỷ sau khi mở)</small></span><input type="date" name="cancelled_at" value="${h(s.cancelled_at || '')}"></label>
        ${(() => { const fee = S.fees[f.product]; const rng = isRangeFee(fee); const ownerRole = (S.users[a.owner] || {}).role; return `<div class="st-done-only grid2">
          <label class="field"><span>会社受取（実績・税抜）${rng ? ' <em>*</em>' : ''}<small>${rng ? `Bắt buộc — gói giá khoảng ${h(feeText(fee))}` : 'Số thực tế cho đơn này (vd +2,000) — để trống = theo bảng giá'}</small></span><input name="actual_fee" type="number" min="0" value="${h(a.actual_fee == null ? '' : a.actual_fee)}"></label>
          ${ownerRole === 'partner' ? `<label class="field"><span>パートナー報酬（実績）<small>HH đối tác cho đơn này — để trống = theo bảng giá</small></span><input name="actual_partner" type="number" min="0" value="${h(a.actual_partner == null ? '' : a.actual_partner)}"></label>` : ''}</div>`; })()}
        <label class="field"><span>コメント<small>Ghi chú gửi người gửi đơn (bắt buộc khi 不備あり)</small></span><textarea name="comment" rows="2"></textarea></label>
        <label class="consent"><input type="checkbox" name="notify" value="1" checked> チャットで通知する<small>Báo vào chat của đơn</small></label>
        <div class="actions"><button class="btn primary">更新 / Cập nhật</button></div></form>
      <form class="form" data-action="note" data-keep data-id="${h(a.id)}"><label class="field"><span>社内メモ<small>Ghi chú nội bộ (người gửi không thấy)</small></span><textarea name="admin_note" rows="2">${h(a.admin_note || '')}</textarea></label><div class="actions"><button class="btn small">メモ保存 / Lưu ghi chú</button></div></form></div>` : '';
    const trashBanner = trashed ? `<div class="flash error trashbanner">🗑 <b>この申込は削除されています</b>（${h(fmtTime(a.trashed.at))} · ${h(a.trashed.name || userName(a.trashed.by))}）— 閲覧のみ。担当者の画面・報酬集計には出ません。<br><small>Đơn đã bị xoá — chỉ xem. Người gửi không thấy và không tính vào 報酬集計.</small><div class="btns" style="margin-top:8px"><button type="button" class="btn small" data-act="appRestore" data-owner="${h(a.owner)}" data-id="${h(a.id)}" data-from="detail">↩ 復元<small>Khôi phục đơn này</small></button></div></div>` : '';
    const delCard = admin && !trashed ? `<div class="card dangerzone"><h2>削除<small>Xoá đơn</small></h2>${DONE_LIKE.includes(s.status)
      ? '<p class="hint">🔒 完了済み（報酬計上あり）の申込は削除できません。先に上の「状態変更」で「キャンセル」にしてください。<br>Đơn đã Hoàn tất (đã tính hoa hồng) không xoá được — hãy đổi trạng thái sang キャンセル trước.</p>'
      : `<p class="hint">削除すると一覧・報酬集計・担当者の画面から外れ、「削除済み」タブに保管されます（復元できます）。担当者にはチャットで通知されます。<br>Đơn chuyển sang mục Đã xoá (không mất, khôi phục được). Người gửi được báo trong chat riêng.</p><button type="button" class="btn" data-act="appDelete" data-owner="${h(a.owner)}" data-id="${h(a.id)}" data-from="detail" data-confirm2>🗑 削除<small>Xoá đơn này</small></button>`}</div>` : '';
    return `<div class="head"><h1>${h(s.app_no)} ${statusBadge(s.status)}<small>${h(f.cust_name)}</small></h1>
      <div class="btns">${trashed ? '<a class="btn" href="#/?tab=trash">← 削除済み / Đã xoá</a>' : '<a class="btn" href="#/">← 一覧 / Danh sách</a>'}${canEdit ? `<a class="btn" href="#/apps/${h(a.owner)}/${h(a.id)}/edit">✎ 修正<small>Sửa đơn</small></a>` : ''}
      ${!admin && s.status === 'received' ? `<form data-action="withdraw" data-confirm data-owner="${h(a.owner)}" data-id="${h(a.id)}" class="inline"><button class="btn">取下げ<small>Rút đơn</small></button></form>` : ''}</div></div>
      ${trashBanner}${s.status === 'incomplete' && s.incomplete_reason && !trashed ? `<div class="flash error"><b>不備内容 / Nội dung cần bổ sung:</b><div class="pre">${h(s.incomplete_reason)}</div><small>修正ボタンから内容を直して再提出してください / Bấm "Sửa đơn" để bổ sung rồi gửi lại.</small></div>` : ''}
      <div class="cols"><div>
        <div class="card"><h2>申込内容<small>Nội dung đơn</small></h2>${admin ? `<p class="hint">担当 / Người gửi: <b>${h(userName(a.owner))}</b> ${S.users[a.owner] ? roleBadge(S.users[a.owner]) : ''}</p>` : ''}
          <table class="detail">${rows.map(([jp, vi, v]) => `<tr><th>${h(jp)}<small>${h(vi)}</small></th><td>${v}</td></tr>`).join('')}</table>
          ${cat.conditions ? `<div class="cond"><b>商材の条件 / Điều kiện gói</b><div class="pre">${h(cat.conditions)}</div></div>` : ''}</div>
        ${trashed ? '' : chatBox('app', a.owner, a.id)}
      </div><div>
        <div class="card"><h2>報酬<small>Hoa hồng</small></h2>${reward}${adminBox}</div>
        ${statusForm}
        <div class="card"><h2>履歴<small>Lịch sử</small></h2><ul class="history">${hist}</ul></div>
        ${delCard}
      </div></div>`;
  },

  rewards(r) {
    const month = isMonth(r.q.get('month')) ? r.q.get('month') : thisMonth();
    const apps = appList().filter((a) => a.owner === uid());
    const lines = linesForMonth(apps, month);
    const hist = [];
    for (let i = 0; i < 6; i++) { const m = prevMonth(month, i); const t = totalsOf(linesForMonth(apps, m)); hist.push(`<tr><td><a href="#/rewards?month=${m}">${m}</a></td><td class="num">${t.count}</td><td class="num">${h(yen(t.total))}</td></tr>`); }
    return `<div class="head"><h1>報酬<small>Hoa hồng của tôi — ${h(month)}</small></h1>${monthNav('/rewards', month)}</div>
      ${totalsTiles(totalsOf(lines))}${rewardLines(lines)}
      ${isPartner() ? V.myRatesCard() : ''}
      <div class="cols"><div class="card"><h2>計算ルール<small>Cách tính</small></h2><ul class="checks">
        <li>報酬は開通・供給開始の月に計上されます<small>Hoa hồng tính vào tháng mở mạng / bắt đầu cấp điện-gas</small></li>
        <li>ストックは契約が続く限り毎月計上<small>Stock được cộng mỗi tháng khi hợp đồng còn hiệu lực</small></li>
        <li>規定期間内の解約は報酬が戻入（マイナス）されます<small>KH huỷ trong thời hạn quy định → hoa hồng bị thu hồi (trừ âm)</small></li></ul></div>
      <div class="card"><h2>過去6ヶ月<small>6 tháng gần đây</small></h2><table class="list"><thead><tr><th>月<small>Tháng</small></th><th class="num">件数<small>Số đơn mở</small></th><th class="num">合計<small>Tổng</small></th></tr></thead><tbody>${hist.join('')}</tbody></table></div></div>`;
  },

  adminRewards(r) {
    const month = isMonth(r.q.get('month')) ? r.q.get('month') : thisMonth();
    const sm = adminSummary(month);
    const t = sm.totals;
    const rows = sm.rows.map((x) => `<tr data-href="#/admin/rewards/${h(x.id)}?month=${month}"><td><b>${h(x.name)}</b><small>${h(x.email || '')}${x.company ? ' · ' + h(x.company) : ''}</small></td><td>${roleBadge(x)}</td>
      <td class="num">${x.count}</td><td class="num">${h(yen(x.one))}${x.pending ? `<small class="warn">未確定 ${x.pending}件</small>` : ''}</td><td class="num">${h(yen(x.stock))}</td><td class="num neg">${x.claw ? h(yen(x.claw)) : '—'}</td><td class="num"><b>${h(yen(x.total))}</b></td>
      <td>${x.bank && x.bank.number ? `<small class="bank">${h(x.bank.name || '')} ${h(x.bank.branch || '')} ${h(x.bank.type || '')} ${h(x.bank.number)}<br>${h(x.bank.holder || '')}</small>` : '<small class="bank none">未登録 / Chưa có</small>'}</td></tr>`).join('');
    return `<div class="head"><h1>報酬集計<small>Tổng hợp hoa hồng — ${h(month)}</small></h1>${monthNav('/admin/rewards', month)}</div>
      <div class="stats"><div class="stat st-new"><b>${t.count}</b>開通件数<small>Đơn mở trong tháng</small></div><div class="stat st-processing"><b>${h(yen(t.company))}</b>会社受取（一時）<small>Công ty nhận (1 lần)</small></div>
      <div class="stat st-partner"><b>${h(yen(t.payout))}</b>支払報酬合計<small>Tổng HH phải trả</small></div><div class="stat st-done"><b>${h(yen(t.company - t.one))}</b>粗利（一時）<small>Công ty giữ lại (1 lần)</small></div></div>
      <div class="btns" style="margin-bottom:12px"><button class="btn" data-act="csvRewards" data-month="${month}">⬇ CSV（支払一覧 / Danh sách chi trả）</button><button class="btn" data-act="csvRewardsDetail" data-month="${month}">⬇ CSV（明細 / Chi tiết từng đơn）</button><button class="btn" data-act="xlsxRewards" data-month="${month}">⬇ Excel（支払一覧＋明細）</button></div>
      ${sm.rows.length ? `<div class="tablewrap"><table class="list"><thead><tr><th>担当<small>Người nhận</small></th><th>権限<small>Loại</small></th><th class="num">件数<small>Số đơn</small></th><th class="num">一時<small>1 lần</small></th><th class="num">ストック<small>Stock</small></th><th class="num">戻入<small>Thu hồi</small></th><th class="num">合計<small>Tổng</small></th><th>振込先<small>TK nhận</small></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">この月の報酬はありません / Tháng này chưa có hoa hồng.</div>'}
      <p class="hint">ストック：開通月から解約月の前月まで毎月計上。戻入：解約日の月に計上。<br>Stock: tính mỗi tháng từ tháng mở đến trước tháng huỷ. Thu hồi: tính vào tháng KH huỷ.</p>`;
  },

  adminRewardsPerson(r) {
    const month = isMonth(r.q.get('month')) ? r.q.get('month') : thisMonth();
    const u = S.users[r.owner];
    if (!u) return V.notFound();
    const lines = linesForMonth(appList().filter((a) => a.owner === r.owner), month);
    return `<div class="head"><h1>${h(u.name)}<small>Chi tiết hoa hồng — ${h(month)}</small></h1>${monthNav('/admin/rewards/' + r.owner, month)}</div>
      <p><a class="btn small" href="#/admin/rewards?month=${month}">← 報酬集計 / Tổng hợp</a> ${roleBadge(u)}</p>${totalsTiles(totalsOf(lines))}${rewardLines(lines)}`;
  },

  products() {
    const st = { staff_rate: 0.5, staff_stock_rate: 0.5, ...S.settings };
    const list = catalogList();
    const missing = list.filter((p) => !S.fees[p.code] || !(S.fees[p.code].company_fee || isRangeFee(S.fees[p.code]))).length;
    const pending = appList().filter((a) => a.state.reward_pending && DONE_LIKE.includes(a.state.status)).length;
    const groups = Object.keys(CATEGORIES).map((cat) => {
      const ps = list.filter((p) => p.category === cat);
      if (!ps.length) return '';
      return `<h2 class="sec">${CATEGORIES[cat].icon} ${h(CATEGORIES[cat].jp)}<small>${h(CATEGORIES[cat].vi)}</small></h2><div class="tablewrap"><table class="list rates">
        <thead><tr><th>コード<small>Mã</small></th><th>商材 · 名義 · プラン<small>Gói</small></th><th class="num">会社受取<small>Công ty nhận</small></th><th class="num">控除<small>Khấu trừ</small></th><th class="num">社員報酬<small>HH nhân viên</small></th><th class="num">パートナー報酬<small>HH đối tác</small></th><th class="num">ストック/月<small>Stock CT / NV / ĐT</small></th><th class="num">戻入<small>Thu hồi</small></th><th>状態</th></tr></thead>
        <tbody>${ps.map((p) => {
          const f = S.fees[p.code] || {};
          const calc = computeReward('staff', p, f, true, st);
          const lim = ageLimits(p);
          return `<tr data-href="#/admin/products/${encodeURIComponent(p.code)}"${p.active ? '' : ' class="inactive"'}><td><b>${h(p.code)}</b></td><td class="wrapcell">${h(p.provider)}<small>${h(p.meigi)} · ${h(p.plan)}${p.has_op ? ' · レ点OP' : ''}${lim ? ` · 年齢${lim[0]}〜${lim[1]}` : ''}${p.no_switch ? ' · OSW NG' : ''}${p.ng_vn ? ' · ベトナム国籍NG' : ''}</small></td>
            <td class="num">${feeText(f) ? h(feeText(f)) + (isRangeFee(f) ? '<small>変動 · nhập khi 完了</small>' : '') : '<span class="badge st-incomplete">未入力<small>Chưa nhập</small></span>'}</td><td class="num">${f.deduction ? h(yen(-f.deduction)) : '—'}</td>
            <td class="num">${isRangeFee(f) ? `<span class="hint">実績×${Math.round(st.staff_rate * 100)}%</span>` : h(yen(calc.one)) + (f.staff_fee == null ? `<small>自動 ${Math.round(st.staff_rate * 100)}%</small>` : '<small>固定 / cố định</small>')}</td>
            <td class="num">${f.partner_fee == null ? '<span class="badge st-incomplete">未設定<small>Chưa nhập</small></span>' : h(yen(f.partner_fee))}</td>
            <td class="num">${f.stock_monthly ? `${h(yen(f.stock_monthly))}<small>${h(yen(calc.stock))} / ${h(yen(f.partner_stock || 0))}</small>` : '—'}</td>
            <td class="num">${Number(f.clawback_rate) > 0 ? Math.round(Number(f.clawback_rate) * 100) + `%<small>${f.clawback_months == null ? 6 : f.clawback_months}ヶ月</small>` : 'なし'}</td>
            <td>${p.active ? '<span class="badge st-done">有効</span>' : '<span class="badge st-cancelled">停止</span>'}</td></tr>`;
        }).join('')}</tbody></table></div>`;
    }).join('');
    const prev = S.importPreview;
    return `<div class="head"><h1>手数料表<small>Bảng giá & hoa hồng (chỉ quản trị thấy)</small></h1><a class="btn primary" href="#/admin/products/new">＋ 商材追加<small>Thêm gói</small></a></div>
      ${missing ? `<div class="flash error">会社受取が未入力の商材が ${missing} 件あります。下の「単価ファイル取込」で一括入力できます。<br><small>Có ${missing} gói chưa có giá công ty nhận — dùng ô "Nhập bảng giá từ file" bên dưới (file Excel hoặc file JSON em gửi riêng).</small></div>` : ''}
      ${pending ? `<div class="flash error">パートナー単価が未設定で、報酬が未確定の申込が ${pending} 件あります（単価を入力すると自動で確定）。<br><small>${pending} đơn đã hoàn tất đang chờ giá đối tác — nhập giá xong sẽ tự tính.</small></div>` : ''}
      <div class="cols"><form class="card form" data-action="settings"><h2>報酬率<small>Tỷ lệ nhân viên</small></h2><div class="grid">
        <label class="field"><span>社員報酬率（%）<small>% HH nhân viên trên phần công ty thực nhận</small></span><input name="staff_rate" type="number" min="0" max="100" value="${Math.round(st.staff_rate * 100)}"></label>
        <label class="field"><span>社員ストック率（%）<small>% stock nhân viên</small></span><input name="staff_stock_rate" type="number" min="0" max="100" value="${Math.round(st.staff_stock_rate * 100)}"></label></div>
        <p class="hint">これから「完了」になる申込に適用されます。<br>Áp dụng cho đơn Hoàn tất từ nay; đơn cũ bấm "Tính lại" trong từng đơn.</p><div class="actions"><button class="btn">保存 / Lưu</button></div></form>
      <div class="card"><h2>単価ファイル取込<small>Nhập bảng giá từ file</small></h2><p class="hint">JSON（bang-gia-v2…）または Excel。会社受取・控除・ストック・戻入率を一括更新し、v2ファイルは商材の追加・更新も行います（パートナー単価は変更しません）。<br>Chọn file giá JSON (bản v2 thêm / cập nhật cả gói) hoặc Excel — cập nhật giá công ty nhận, khấu trừ, stock, thu hồi (không đổi giá đối tác).</p>
        <input type="file" id="feesfile" accept=".xlsx,.json">
        ${prev ? `<div class="flash ok" style="margin-top:12px">${prev.rows.length} 件を読み込みました / Đọc được ${prev.rows.length} gói${prev.catalog ? `<br>商材：新規 ${prev.newCodes.length} 件・更新 ${Object.keys(prev.catalog).length - prev.newCodes.length} 件 / Gói mới ${prev.newCodes.length}, cập nhật ${Object.keys(prev.catalog).length - prev.newCodes.length}${prev.newCodes.length ? `<small>${h(prev.newCodes.join(', '))}</small>` : ''}` : ''}<br><small>${prev.rows.slice(0, 6).map((x) => `${h(x.code)} ${h(feeText(x) || yen(x.company_fee))}`).join(' · ')}${prev.rows.length > 6 ? ' …' : ''}</small></div><div class="actions"><button class="btn" data-act="importCancel">キャンセル / Huỷ</button> <button class="btn primary" data-act="importApply">取込 / Nhập vào hệ thống</button></div>` : ''}
      </div></div>${groups}`;
  },

  chat(dmOwner) {
    const admin = isAdmin();
    const threads = allThreads();
    let current = null;
    if (!admin) {
      current = { kind: 'dm', owner: uid(), title: 'NASON へのお問い合わせ<small>Hỏi đáp với NASON</small>' };
      if (!threads.some((t) => t.kind === 'dm')) threads.unshift({ kind: 'dm', owner: uid(), title: 'NASON へのお問い合わせ', subtitle: 'Hỏi đáp chung', href: '#/chat', unread: 0 });
      threads.forEach((t) => { if (t.kind === 'dm') t.on = true; });
    } else if (dmOwner) {
      const u = S.users[dmOwner];
      if (!u || u.role === 'kanri') return V.notFound();
      current = { kind: 'dm', owner: dmOwner, title: `${h(u.name)}<small>Chat riêng</small>` };
      if (!threads.some((t) => t.kind === 'dm' && t.owner === dmOwner)) threads.unshift({ kind: 'dm', owner: dmOwner, title: '💬 ' + u.name, subtitle: '新規 / Mới', href: '#/chat/dm/' + dmOwner, unread: 0 });
      threads.forEach((t) => { if (t.kind === 'dm' && t.owner === dmOwner) t.on = true; });
    }
    const li = threads.map((t) => `<li><a href="${h(t.href)}"${t.on ? ' class="on"' : ''}><b>${h(t.title)}</b>${t.unread ? ` <span class="badge unread">${t.unread}</span>` : ''}<small>${h(t.subtitle || '')}${t.last ? ' · ' + h(fmtTime(t.last.at)) : ''}</small>${t.last ? `<small class="snippet">${h(String(t.last.body).slice(0, 60))}</small>` : ''}</a></li>`).join('') || '<li class="hint" style="padding:10px">まだメッセージはありません / Chưa có tin nhắn</li>';
    return `<div class="head"><h1>チャット<small>${admin ? 'Hộp thư — tất cả cuộc trò chuyện' : 'Trao đổi với NASON'}</small></h1></div>
      <div class="chatwrap"><div class="card"><h2>${admin ? '受信箱<small>Hộp thư</small>' : 'スレッド<small>Cuộc trò chuyện</small>'}</h2><ul class="inbox">${li}</ul></div>
      <div>${current ? chatBox(current.kind, current.owner, '', current.title) : '<div class="empty">左の一覧から選択してください / Chọn một cuộc trò chuyện</div>'}</div></div>`;
  },

  // Tài khoản đang dùng / kho lưu trữ (tài khoản bị khoá tự vào lưu trữ, khôi phục thì quay lại)
  accounts(r) {
    const tab = r && r.q && r.q.get('tab') === 'archive' ? 'archive' : 'active';
    const counts = {};
    appList().forEach((a) => { counts[a.owner] = (counts[a.owner] || 0) + 1; });
    const all = Object.entries(S.users).map(([id, u]) => ({ id, ...u }));
    const act = all.filter((u) => u.active !== false).sort((a, b) => (b.is_owner ? 1 : 0) - (a.is_owner ? 1 : 0) || String(a.role).localeCompare(b.role) || String(a.name).localeCompare(b.name));
    const arc = all.filter((u) => u.active === false).sort((a, b) => (b.disabled_at || 0) - (a.disabled_at || 0));
    const tabs = `<div class="tabs"><a href="#/admin/accounts"${tab === 'active' ? ' class="on"' : ''}>有効 <span class="badge">${act.length}</span><small>Đang dùng</small></a><a href="#/admin/accounts?tab=archive"${tab === 'archive' ? ' class="on"' : ''}>📦 アーカイブ <span class="badge">${arc.length}</span><small>Lưu trữ — tài khoản đã khoá</small></a></div>`;
    const bank = (u) => { if (u.role === 'kanri') return '<span class="hint">—</span>'; const m = bankMissing(u.bank); return !m.length ? '<small class="bank">✓ 登録済 / Đã có</small>' : (m.length === 4 ? '<small class="bank none">未登録 / Chưa có</small>' : `<small class="bank none">⚠ 一部未入力 / Thiếu: ${h(m.map((x) => x.split(' / ')[0]).join('、'))}</small>`); };
    let table;
    if (tab === 'active') {
      table = `<div class="tablewrap"><table class="list" id="acctActive"><thead><tr><th>表示名<small>Tên / Công ty</small></th><th>メール<small>Email đăng nhập</small></th><th>パスワード<small>Mật khẩu</small></th><th>権限<small>Quyền</small></th><th>状態<small>Trạng thái</small></th><th class="num">申込数<small>Số đơn</small></th><th>振込先<small>TK nhận HH</small></th></tr></thead>
        <tbody>${act.map((u) => `<tr data-href="#/admin/accounts/${h(u.id)}"><td><b>${h(u.name)}</b>${u.company ? `<small>${h(u.company)}</small>` : ''}</td><td>${h(u.email)}</td><td class="pwtd">${pwCell(u)}</td><td>${roleBadge(u)}</td>
          <td><span class="badge st-done">有効<small>Đang dùng</small></span></td>
          <td class="num">${counts[u.id] || 0}</td><td>${bank(u)}</td></tr>`).join('')}</tbody></table></div>`;
    } else {
      table = arc.length ? `<div class="tablewrap"><table class="list" id="acctArchive"><thead><tr><th>表示名<small>Tên / Công ty</small></th><th>メール<small>Email</small></th><th>権限<small>Quyền</small></th><th>停止日<small>Ngày khoá · người khoá</small></th><th class="num">申込数<small>Số đơn (vẫn giữ)</small></th><th></th></tr></thead>
        <tbody>${arc.map((u) => `<tr data-href="#/admin/accounts/${h(u.id)}" class="archived"><td><b>${h(u.name)}</b>${u.company ? `<small>${h(u.company)}</small>` : ''}</td><td>${h(u.email)}</td><td>${roleBadge(u)}</td>
          <td>${h(fmtTime(u.disabled_at))}<small>${u.disabled_by ? h(userName(u.disabled_by)) : ''}</small></td><td class="num">${counts[u.id] || 0}</td>
          <td><button class="btn small" data-act="accountToggle" data-id="${h(u.id)}" data-stay="1" data-confirm2>↩ 復元<small>Khôi phục</small></button></td></tr>`).join('')}</tbody></table></div>`
        : '<div class="empty">アーカイブはありません / Chưa có tài khoản nào trong lưu trữ.</div>';
    }
    return `<div class="head"><h1>アカウント管理<small>Quản lý tài khoản</small></h1><div class="btns"><a class="btn primary" href="#/admin/accounts/new">＋ 新規作成<small>Tạo tài khoản</small></a></div></div>
      ${tabs}${table}
      <p class="hint">${tab === 'active' ? '社員・パートナーは自分の申込と報酬だけ閲覧できます。管理者はすべて閲覧できます。停止したアカウントは自動でアーカイブに移動します。<br>Nhân viên & đối tác chỉ thấy đơn và hoa hồng của chính mình. Tài khoản bị khoá sẽ tự chuyển sang Lưu trữ.' : 'アーカイブ中のアカウントはログインできません。申込・報酬・契約書・チャットのデータはすべて保持され、「復元」で元に戻ります。<br>Tài khoản trong Lưu trữ không đăng nhập được. Đơn, hoa hồng, hợp đồng, chat vẫn giữ nguyên — bấm 復元 để khôi phục.'}</p>`;
  },

  accountNew() {
    return `<div class="head"><h1>アカウント作成<small>Tạo tài khoản mới</small></h1><a class="btn" href="#/admin/accounts">← 一覧 / Danh sách</a></div>
      <form class="card form narrow" data-action="accountCreate" data-keep autocomplete="off">
        <label class="field"><span>メール <em>*</em><small>Email đăng nhập (nên là email thật để tự đặt lại mật khẩu)</small></span><input name="email" type="email" required></label>
        <label class="field"><span>表示名 <em>*</em><small>Tên hiển thị</small></span><input name="name" required></label>
        <label class="field"><span>会社名・チーム名<small>Tên công ty / nhóm (không bắt buộc — CTV cá nhân để trống)</small></span><input name="company"></label>
        <label class="field"><span>代表者名<small>Người đại diện ký hợp đồng (vd 代表取締役 山田太郎 → 山田太郎)</small></span><input name="rep_name"></label>
        <label class="field"><span>住所 <em>*</em><small>Địa chỉ — bắt buộc với đối tác (ghi vào hợp đồng)</small></span><input name="address"></label>
        <label class="field"><span>電話番号<small>Điện thoại</small></span><input name="phone"></label>
        <div class="field"><span>権限<small>Quyền</small></span>${roleRadios('partner')}</div>
        <label class="field"><span>パスワード<small>Mật khẩu (không bắt buộc, ≥ 6 ký tự — để trống thì hệ thống tự tạo mật khẩu đơn giản, vd kamu4827)</small></span><input name="password" type="text" maxlength="64" autocomplete="off" spellcheck="false" placeholder="空欄＝自動作成 / để trống = tự tạo"></label>
        <p class="hint">パートナーを作成すると、NASON押印済みの契約書が自動で発行されます（会社名・代表者名・住所が乙欄に入ります）。パートナーはログイン後すぐにシステムを使え、画面上部の案内から契約書に署名します。<br>Tạo đối tác → hợp đồng (đã đóng dấu NASON) tự phát hành, tự điền công ty / người đại diện / địa chỉ vào phần Bên B. Đối tác đăng nhập là dùng ngay hệ thống; đầu trang có thanh nhắc ký hợp đồng.</p>
        <p class="hint">パスワードは作成後すぐ表示され、あとから「アカウント詳細」で管理者が確認できます。ログイン後すぐに使えます（変更の強制はありません）。<br>Mật khẩu hiện ngay sau khi tạo và được lưu để anh xem lại ở Chi tiết tài khoản (chỉ quản trị thấy). Người dùng đăng nhập là dùng ngay, không bị bắt đổi MK (muốn đổi: Tài khoản → Đổi mật khẩu).</p>
        <div class="actions"><button class="btn primary">作成する / Tạo tài khoản</button></div></form>`;
  },

  accountCreated() {
    const t = S.tempCard;
    if (!t) return V.accounts();
    const re = !!t.reset; // true = kết quả của 「パスワード設定」 (đặt MK mới cho tài khoản đã có)
    return `<div class="head"><h1>${re ? 'パスワードを設定しました<small>Đã đặt mật khẩu mới</small>' : 'アカウントを作成しました<small>Đã tạo tài khoản</small>'}</h1><a class="btn" href="#/admin/accounts${re ? '/' + h(t.id) : ''}">${re ? '← アカウント / Tài khoản' : '← 一覧 / Danh sách'}</a></div>
      <div class="card ref-card"><table class="detail"><tr><th>メール<small>Email đăng nhập</small></th><td><b>${h(t.email)}</b></td></tr><tr><th>表示名<small>Tên</small></th><td>${h(t.name)}</td></tr>
        <tr><th>パスワード<small>Mật khẩu${t.typed ? ' (anh tự đặt)' : ' (hệ thống tạo)'}</small></th><td><div class="copyrow"><input readonly value="${h(t.pw)}" class="mono" id="tmppw"><button type="button" class="btn small" data-copy-from="tmppw">コピー / Copy</button></div></td></tr></table>
        ${re ? '<div class="flash ok" style="margin-top:14px">パスワードを変更しました。以前のパスワードはもう使えません（ログイン中の端末は約1時間以内に無効）。保管パスワードも更新済みです。本人にお伝えください。<br><small>Đã đổi MK thật trên Firebase. MK cũ hết dùng (phiên đang đăng nhập hết hiệu lực trong khoảng 1 giờ). Kho MK đã cập nhật. Gửi MK mới cho người dùng qua Lark / Zalo.</small></div>' : ''}
        ${re ? '' : `<div class="flash ok" style="margin-top:14px">本人にお伝えください。ログイン後すぐに使えます。パスワードは保管され、あとから「アカウント詳細 → 保管パスワード」で確認できます（管理者のみ）。<br><small>Gửi cho người dùng qua Lark / Zalo. Họ đăng nhập là dùng ngay, không bị bắt đổi MK. Mật khẩu được lưu (chữ thường, không mã hoá) — sau này anh xem lại ở Chi tiết tài khoản → 「保管パスワード」 (chỉ quản trị thấy); tự cập nhật khi họ đổi MK / đăng nhập.</small></div>`}
        ${!re && t.role === 'partner' ? (t.contract ? '<div class="flash ok">📨 契約書（NASON押印済）を自動で発行しました。ログイン後、画面上部のご案内から署名してもらってください（システムはそのまま使えます）。<br><small>Đã tự phát hành hợp đồng (đã đóng dấu). Đối tác đăng nhập là dùng ngay hệ thống; đầu trang có thanh nhắc ký hợp đồng.</small></div>' : '<div class="flash error">会社印が未登録のため、契約書はまだ発行されていません。「契約書管理」で会社印を登録して発行してください。<br><small>Chưa có con dấu NASON nên hợp đồng chưa phát hành — tải con dấu ở 契約書管理 rồi phát hành.</small></div>') : ''}
        ${V.loginBlock(t)}</div>`;
  },

  // Link đăng nhập (bấm được, mở tab mới) + nút Copy link + tin nhắn mẫu JP/VI để gửi người dùng (mật khẩu chỉ nằm trên màn hình này, không lưu vào DB)
  loginBlock(t) {
    const url = loginUrl();
    const partnerNew = !t.reset && t.role === 'partner';
    const msg = ['【NASON HOME 申込システム / Hệ thống đăng ký NASON HOME】',
      'ログインURL / Link đăng nhập:', url, '',
      'メール / Email: ' + t.email,
      'パスワード / Mật khẩu: ' + t.pw, '',
      '※ログイン後、パスワードは「アカウント → パスワード変更」で変更できます。 / Sau khi đăng nhập có thể đổi mật khẩu ở Tài khoản → Đổi mật khẩu.']
      .concat(partnerNew ? ['※ログイン後、画面上部のご案内から契約書をご確認のうえ署名してください。 / Sau khi đăng nhập, đầu trang sẽ có thanh nhắc — vui lòng bấm vào đọc và ký hợp đồng.'] : []).join('\n');
    return `<h2 class="sec">ログインリンク<small>Link đăng nhập — gửi cho người dùng</small></h2>
      <div class="copyrow full"><input readonly id="loginurl" value="${h(url)}" class="mono" aria-label="login url"><button type="button" class="btn small" data-copy-from="loginurl">📋 リンクをコピー / Copy link</button><a class="btn small primary" id="loginlink" href="${h(url)}" target="_blank" rel="noopener noreferrer">🔗 開く / Mở thử</a></div>
      <p class="hint">「開く」で新しいタブにログイン画面が開きます（今のこの画面はそのまま残ります）。<br>Bấm "Mở thử" để mở trang đăng nhập ở tab mới (màn hình này vẫn giữ nguyên) — hoặc copy link gửi cho người dùng.</p>
      <label class="field"><span>そのまま送れるメッセージ<small>Tin nhắn gửi sẵn (Lark / Zalo / mail)</small></span><textarea readonly id="loginmsg" rows="9" class="msgbox">${h(msg)}</textarea></label>
      <div class="copyrow"><button type="button" class="btn small primary" data-copy-from="loginmsg">📋 メッセージをコピー / Copy tin nhắn</button></div>`;
  },

  // Link đăng nhập riêng cho 1 tài khoản (quản trị gửi cho đối tác / nhân viên): link sạch + email điền sẵn, kiểm tra link sống, copy / mở thử / chia sẻ / email
  // Trang công khai cho CTV (không đăng nhập): link do đối tác tạo. Mọi dữ liệu đọc/ghi đi qua B.pub (auth = null) và bị Rules v4 giới hạn.
  ctv(r) {
    let c = S.ctvPage;
    if (!c || c.owner !== r.owner || c.token !== r.token) {
      c = S.ctvPage = { owner: r.owner, token: r.token, state: 'loading', catalog: {}, link: null, done: null, err: '' };
      if (!CTV_TOKEN_RE.test(r.token) || !/^[A-Za-z0-9_-]{6,64}$/.test(r.owner)) c.state = 'invalid';
      else setTimeout(() => loadCtvPage(c), 0);
    }
    const msg = (jp, vi, extra) => `<div class="card narrow center-card"><h1>${h(jp)}<small>${h(vi)}</small></h1>${extra || ''}</div>`;
    if (c.state === 'loading') return '<div class="empty">読み込み中… / Đang tải…</div>';
    if (c.state === 'invalid') return msg('このリンクは無効です', 'Link không hợp lệ', '<p>URLが正しいかご確認ください。取次店にお問い合わせください。<br>Hãy kiểm tra lại đường link hoặc hỏi người gửi link cho bạn.</p>');
    if (c.state === 'closed') return msg('このリンクは停止されています', 'Link này đã bị tắt', '<p>取次店に新しいリンクをお問い合わせください。<br>Hãy xin người gửi link một đường link mới.</p>');
    if (c.state === 'error') return msg('読み込みできませんでした', 'Không tải được', `<p class="pre">${h(c.err)}</p><div class="actions"><button type="button" class="btn primary" data-act="ctvReload">再読み込み / Thử lại</button></div>`);
    if (c.done) {
      return `<div class="card narrow center-card ctvok" id="ctvDone"><h1>✅ 申込を受け付けました<small>Đã nhận đơn đăng ký</small></h1>
        <p>申込番号 / Mã đơn：<b>${h(c.done.app_no)}</b></p>
        <p>${h(c.link.name)} が内容を確認します。<br><small>${h(c.link.name)} sẽ kiểm tra và xử lý đơn này.</small></p>
        <div class="actions"><button type="button" class="btn primary" data-act="ctvAgain">続けて入力 / Nhập đơn khác</button></div></div>`;
    }
    return `<div class="card ctvhead" id="ctvHead"><h1>新規申込フォーム<small>Đăng ký mới — dành cho CTV của ${h(c.link.name)}</small></h1>
        <p class="hint">取次店：<b>${h(c.link.name)}</b>　（ログイン不要 / Không cần đăng nhập）<br>お客様の情報を入力して送信してください。送信した内容は取次店とNASON HOMEが確認します。<br>Điền thông tin khách hàng rồi gửi. Đơn sẽ chuyển thẳng cho ${h(c.link.name)} và NASON HOME xử lý.</p></div>${V.apply(null, r, c)}`;
  },
  // Khung "link CTV" của đối tác / nhân viên (trang アカウント)
  ctvCard() {
    const me = uid();
    const links = Object.entries(S.ctvLinks || {}).map(([token, v]) => ({ token, ...(v || {}) })).sort((a, b) => (b.at || 0) - (a.at || 0));
    const cur = links.find((l) => l.on === true) || links[0] || null;
    const count = (tok) => appList().filter((a) => a.ctv && a.ctv.token === tok).length;
    const head = '<h2>🔗 CTV用 申込リンク<small>Link nhập đơn cho CTV — không cần đăng nhập</small></h2>';
    const intro = '<p class="hint">このリンクをCTV（協力者）に送ると、CTVがログインなしで<b>新規申込</b>を入力できます。入力された申込は<b>あなたの申込一覧</b>に入ります。<br>Gửi link này cho CTV của anh/chị: CTV mở ra là điền được form <b>新規申込 (Đăng ký mới)</b> mà <b>không cần đăng nhập</b>. Đơn CTV gửi sẽ vào <b>danh sách đơn của anh/chị</b>.</p>';
    if (S.subErr.ctvLinks) return `<div class="card" id="ctvCard">${head}<div class="flash error">⚠ 現在この機能を使えません（Firebase の Rules が古い可能性）。NASON にご連絡ください。<br><small>Chưa dùng được tính năng này (Rules Firebase có thể chưa cập nhật) — nhắn NASON để cập nhật. (${h(S.subErr.ctvLinks)})</small></div></div>`;
    if (!cur) return `<div class="card" id="ctvCard">${head}${intro}<div class="actions"><button type="button" class="btn primary" data-act="ctvCreate" id="ctvCreate">🔗 リンクを作成 / Tạo link CTV</button></div></div>`;
    const url = ctvLinkFor(me, cur.token);
    const on = cur.on === true;
    const msg = ['【' + (S.me.name || '') + '】新規申込フォーム / Form đăng ký mới', '', '下のリンクを開いて、お客様の情報を入力してください（ログイン不要）。', 'Mở link bên dưới và điền thông tin khách hàng (không cần đăng nhập):', url].join('\n');
    const share = typeof navigator !== 'undefined' && navigator.share ? '<button type="button" class="btn small" data-act="ctvShare" id="ctvShare">📤 共有 / Chia sẻ<small>Zalo · LINE · Mail…</small></button>' : '';
    const n = count(cur.token);
    const oldN = links.filter((l) => l.token !== cur.token).length;
    return `<div class="card" id="ctvCard">${head}${intro}
      <p class="ctvstate">${on ? '<span class="badge st-done">● 有効<small>Đang bật</small></span>' : '<span class="badge st-cancelled">● 停止中<small>Đang tắt — CTV không gửi được</small></span>'} <span class="hint">受信 ${n} 件 / Đã nhận ${n} đơn qua link này</span></p>
      <div class="copyrow full"><input readonly id="ctvlink" value="${h(url)}" class="mono" aria-label="CTV link" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
      <div class="btns linkbtns"><button type="button" class="btn small primary" data-copy-from="ctvlink" id="ctvCopy">📋 コピー / Copy link</button><a class="btn small" id="ctvOpen" href="${h(url)}" target="_blank" rel="noopener noreferrer">🔗 開く / Mở thử</a>${share}</div>
      <details class="vaultmsg"><summary>📨 そのまま送れるメッセージ<small>Tin nhắn gửi sẵn cho CTV</small></summary><textarea readonly id="ctvmsg" rows="6" class="msgbox">${h(msg)}</textarea>
        <div class="copyrow"><button type="button" class="btn small primary" data-copy-from="ctvmsg">📋 メッセージをコピー / Copy tin nhắn</button></div></details>
      <div class="btns linkbtns"><button type="button" class="btn small" data-act="ctvToggle" data-owner="${h(me)}" data-token="${h(cur.token)}" data-on="${on ? '0' : '1'}" id="ctvToggle">${on ? '⏸ 停止する / Tắt link' : '▶ 再開する / Bật lại'}</button>
        <button type="button" class="btn small" data-act="ctvCreate" id="ctvRegen" data-confirm2>🔄 再発行 / Tạo link mới<small>Link cũ ngừng ngay</small></button></div>
      <p class="hint">リンクを知っている人は誰でも申込を送信できます。漏れた・不要になったときは「停止」または「再発行」してください。${oldN ? `（過去のリンク ${oldN} 件は停止済み）` : ''}<br>Ai có link đều gửi được đơn. Nếu link bị lộ hoặc không dùng nữa → bấm <b>Tắt link</b> hoặc <b>Tạo link mới</b> (link cũ ngừng ngay).</p></div>`;
  },
  // Tài khoản tổng: mã khôi phục (quên MK mà không cần email). Mã chỉ hiện 1 lần ngay sau khi tạo.
  recoveryCard() {
    const rec = S.recovery || {};
    const has = !!rec.pub;
    const head = '<h2>🛟 復旧コード<small>Mã khôi phục — dùng khi quên MK tài khoản tổng (không cần email)</small></h2>';
    if (S.recCode) {
      return `<div class="card" id="recCard">${head}

      <details class="vaultmsg"><summary>📨 そのまま送れるメッセージ<small>Tin nhắn gửi sẵn (link + email, mật khẩu gửi riêng)</small></summary>

        ${u.role !== 'kanri' ? `<h2>振込先<small>Tài khoản nhận hoa hồng</small></h2>${bankFields(u.bank || {}, ownerLocked)}` : ''}

        ${ownerLocked ? '' : '<div class="actions"><button class="btn primary">保存 / Lưu</button></div>'}</form>
      <div><div class="card"><h2>状態<small>Trạng thái</small></h2><table class="detail">

        </div></div>${u.role === 'partner' ? V.ratesCard(id, u) : ''}${u.role !== 'kanri' && u.active !== false && !self && !u.is_owner ? V.loginLinkCard(id, u) : ''}${u.role !== 'kanri' && !u.is_owner ? V.ctvAdminCard(id, u) : ''}${vaultOk(id, u) ? `<div class="card" id="vaultCard"><h2>🔑 保管パスワード<small>Mật khẩu đang lưu — chỉ quản trị thấy</small></h2><div id="vaultBox" data-id="${h(id)}">${vaultBox(id)}</div></div>` : ''}${vaultOk(id, u) && u.active !== false ? V.pwSetCard(id) : ''}</div></div>`;

  // ---------- Hợp đồng (đối tác) ----------
  contract() {
    const c = myContract();
    const me = uid();
    const head = `<div class="head"><h1>商材取次契約書<small>Hợp đồng môi giới dịch vụ</small></h1>${c ? cstatusBadge(effStatus(c)) : ''}</div>`;
    const vault = vaultSection(vaultOf(me), false);
    if (!c && S.subErr.contracts) {
      return `${head}<div class="card narrow center-card gatecard"><h2>⚠ 契約書を読み込めません<small>Không đọc được hợp đồng</small></h2>
        <div class="flash error">Firebase の権限設定（Rules）により、契約書を読み込めません。NASON HOME にご連絡ください。<br><small>Hệ thống đang bị Firebase chặn quyền đọc hợp đồng (Rules chưa cập nhật). Anh/chị báo NASON HOME để cập nhật; trang sẽ tự thử lại mỗi 20 giây — khi sửa xong hợp đồng sẽ tự hiện ra. (Mã: ${h(S.subErr.contracts)})</small></div>
        <div class="actions"><button type="button" class="btn primary" data-act="contractRetry">再読み込み / Thử lại ngay</button></div></div>`;
    }
    if (!c) {
      return `${head}<div class="card narrow center-card gatecard"><h2>⏳ 契約書を準備中です<small>NASON đang chuẩn bị hợp đồng</small></h2>
        <p>NASON HOME が商材取次契約書を準備しています。発行されるとこの画面に表示され、画面上部にご案内が出ますので、そのときに署名をお願いします。それまでシステムは通常どおりご利用いただけます。<br><small>Khi NASON phát hành, hợp đồng sẽ hiện ở đây và có thanh nhắc ký ở đầu trang. Trong lúc chờ anh/chị vẫn dùng hệ thống bình thường.</small></p>
        <div class="actions"><a class="btn primary" href="#/">申込一覧へ / Vào danh sách đơn →</a></div></div>${vault}`;
    }
    let top = '';
    const es = effStatus(c);
    if (es === 'sent') top = `<div class="flash warn">${c.kou_sign ? 'NASON HOME は押印済みです。内容をご確認のうえ、ページ下部で署名すると契約が締結されます。' : '内容をご確認のうえ、ページ下部で署名してください。'}<br><small>${c.kou_sign ? 'NASON đã đóng dấu sẵn — đọc kỹ rồi ký ở cuối trang là hợp đồng có hiệu lực ngay.' : 'Vui lòng đọc kỹ hợp đồng, sau đó ký ở cuối trang.'}</small></div>`;
    if (es === 'signed') top = '<div class="flash ok">署名ありがとうございました。NASONの確認後に「締結済」になります。<br><small>Đã ký — chờ NASON xác nhận và đóng dấu.</small></div>';
    if (es === 'concluded') top = '<div class="flash ok">契約が締結されました。下の「契約書保管」からいつでもPDFを保存できます。<br><small>Hợp đồng đã ký kết — tải PDF bất cứ lúc nào ở mục Lưu trữ hợp đồng bên dưới.</small></div>';
    const signForm = c.status === 'sent' ? `<form class="card form signform" id="signform" data-action="contractSign" data-keep data-confirm>
        <h2>署名<small>Ký hợp đồng</small></h2>
        <label class="consent"><input type="checkbox" name="agree" value="1"> 上記の契約内容をすべて確認し、同意します。<small>Tôi đã đọc và đồng ý với toàn bộ nội dung hợp đồng ở trên.</small></label>
        <label class="field"><span>署名者氏名 <em>*</em><small>Họ tên người ký</small></span><input name="signer" maxlength="60" value="${h((c.otsu || {}).rep_name || (c.otsu || {}).name || '')}"></label>

  // ---------- Hợp đồng (quản trị) ----------
  adminContracts(r) {
    const tab = r && r.q && r.q.get('tab') === 'vault' ? 'vault' : 'list';
    const allP = Object.entries(S.users).filter(([, u]) => u.role === 'partner').map(([id, u]) => ({ id, ...u, c: (S.contracts || {})[id] || null }));

    const archivedP = allP.filter((p) => p.active === false);

    partners.forEach((p) => { counts[st(p)] = (counts[st(p)] || 0) + 1; });
    const order = { signed: 0, sent: 1, none: 2, concluded: 3 };
    partners.sort((a, b) => order[st(a)] - order[st(b)] || String(a.name).localeCompare(b.name));
    const seal = sealUrl();
    // Nút thao tác trên từng dòng — luôn bấm được; thiếu điều kiện thì khi bấm sẽ hiện lý do (không để nút xám chết)
    const rowActions = (p) => {
      const miss = issueMissing(p);
      const warn = miss ? `<small class="warn">未入力 · thiếu: ${h(miss)} → <a href="#/admin/accounts/${h(p.id)}">入力 / Nhập</a></small>` : '';
      if (p.active === false) return warn;
      const s0 = st(p);
      const btn = (act, cls, label, sub) => `<button type="button" class="btn small ${cls}" data-act="${act}" data-id="${h(p.id)}" data-confirm2>${label}<small>${sub}</small></button>`;
      if (s0 === 'none') return btn('contractIssueOne', 'primary', '📨 発行', 'Phát hành') + warn;
      if (s0 === 'sent') return btn('contractCancel', '', '取消', 'Huỷ phát hành') + warn;
      if (s0 === 'signed') return btn('contractConcludeOne', 'primary', '🖋 締結', 'Ký kết') + warn;
      return btn('contractIssueOne', '', '↻ 再発行', 'Phát hành lại') + warn;
    };
    const rowOf = (p) => `<tr data-href="#/admin/contracts/${h(p.id)}"${p.active ? '' : ' class="inactive"'}><td><b>${h(p.name)}</b><small>${h(p.company || '（個人）')}${p.rep_name ? ' · ' + h(p.rep_name) : ''}</small></td><td>${h(p.email)}</td><td>${cstatusBadge(st(p))}${deliveryBadge(p.id)}</td>
      <td>${p.c ? h(fmtTime(p.c.issued_at)) : '—'}</td><td>${p.c && p.c.sign ? h(fmtTime(p.c.sign.at)) : '—'}</td><td>${concludedAt(p.c) ? h(fmtTime(concludedAt(p.c))) : '—'}</td>
      <td class="rowact">${rowActions(p)}</td></tr>`;
    const rows = partners.map(rowOf).join('');
    const thead = '<thead><tr><th>パートナー<small>Đối tác</small></th><th>メール<small>Email</small></th><th>状態<small>Trạng thái</small></th><th>発行<small>Phát hành</small></th><th>乙署名<small>Đối tác ký</small></th><th>締結<small>Ký kết</small></th><th>操作<small>Thao tác</small></th></tr></thead>';
    const archHtml = archivedP.length ? `<details class="card archive"><summary>📦 アーカイブ（停止中のパートナー）${archivedP.length} 件<small>Đối tác đã khoá — hợp đồng vẫn được lưu</small></summary><div class="tablewrap"><table class="list">${thead}<tbody>${archivedP.map(rowOf).join('')}</tbody></table></div></details>` : '';
    const vaultAll = allP.flatMap((p) => vaultOf(p.id));
    const tabs = `<div class="tabs"><a href="#/admin/contracts"${tab === 'list' ? ' class="on"' : ''}>一覧 <span class="badge">${partners.length}</span><small>Danh sách đối tác</small></a><a href="#/admin/contracts?tab=vault"${tab === 'vault' ? ' class="on"' : ''}>🗄 保管庫 <span class="badge">${vaultAll.length}</span><small>Lưu trữ hợp đồng đã ký</small></a></div>`;
    if (tab === 'vault') {
      const q = clean(r.q.get('q'), 60).toLowerCase();
      const items = q ? vaultAll.filter((v) => { const o = v.c.otsu || {}; return [o.company, o.rep_name, o.name, o.email, o.address].some((x) => String(x || '').toLowerCase().includes(q)); }) : vaultAll;
      items.sort((x, y) => ((y.c.sign || {}).at || 0) - ((x.c.sign || {}).at || 0));
      return `<div class="head"><h1>契約書管理<small>Quản lý hợp đồng đối tác</small></h1><button class="btn" data-act="xlsxVault">⬇ Excel（保管庫 / Lưu trữ）</button></div>${tabs}
        <form class="card filters" data-action="vaultFilter"><input type="search" name="q" value="${h(r.q.get('q') || '')}" placeholder="会社名・氏名・メールで検索 / Tìm theo công ty, tên, email"><button class="btn">検索 / Tìm</button>${q ? '<a class="btn" href="#/admin/contracts?tab=vault">クリア / Xoá lọc</a>' : ''}</form>
        ${vaultSection(items, true)}
        <p class="hint">署名済みの契約書はすべてここに保管されます（停止中のパートナー・再発行前の旧版を含む）。内容は署名時点で固定され、変更・削除できません。<br>Mọi hợp đồng đã ký đều được lưu tại đây (kể cả đối tác đã khoá và bản cũ trước khi phát hành lại). Nội dung khoá tại thời điểm ký, không sửa / xoá được.</p>`;
    }
    const noContract = partners.filter((p) => st(p) === 'none');
    const bulk = noContract.length ? `<button class="btn primary" data-act="contractIssueAll" data-confirm2>📨 全員に一括発行（${noContract.length}名）<small>Phát hành cho tất cả đối tác chưa có hợp đồng</small></button>` : '<span class="hint">✅ 全パートナーに発行済み / Tất cả đối tác đã có hợp đồng</span>';
    return `<div class="head"><h1>契約書管理<small>Quản lý hợp đồng đối tác</small></h1><div class="btns">${bulk}<button class="btn" data-act="xlsxContractsList">⬇ Excel（一覧 / Danh sách）</button></div></div>${tabs}
      ${(() => { const sk = (S.issueSkipped || []).filter((x) => S.users[x.id] && issueMissing(S.users[x.id])); return sk.length ? `<div class="flash error">情報不足のため発行できなかったパートナー / Chưa phát hành được do thiếu thông tin: ${sk.map((x) => `<a href="#/admin/accounts/${h(x.id)}">${h(x.name)}</a>（${h(issueMissing(S.users[x.id]))}）`).join('、')}</div>` : ''; })()}
      <div class="stats">${['none', 'sent', 'signed', 'concluded'].map((k) => `<div class="stat ${CSTATUS[k][2]}"><b>${counts[k] || 0}</b>${h(CSTATUS[k][0])}<small>${h(CSTATUS[k][1])}</small></div>`).join('')}</div>
      <div class="cols"><div>${partners.length ? `<div class="tablewrap"><table class="list" id="activePartners">${thead}<tbody>${rows}</tbody></table></div>` : '<div class="empty">パートナーのアカウントがありません / Chưa có tài khoản đối tác.</div>'}${archHtml}</div>
      <div class="card"><h2>会社印（電子印影）<small>Con dấu công ty dùng khi ký kết</small></h2>
        <div class="sealbox">${seal ? `<img src="${h(seal)}" alt="会社印">` : '<span class="hint">未登録 / Chưa có</span>'}</div>
        <p class="hint">印影の画像（PNG/JPG、白い紙に押した印をスマホで撮影したもの等）を選択してください。白い背景は自動で透明になります。<br>Chọn ảnh con dấu (chụp dấu đỏ trên giấy trắng). Nền trắng sẽ tự xoá.</p>
        <input type="file" id="sealfile" accept="image/png,image/jpeg"></div></div>`;
  },

  adminContract(id, u) {

    const status = effStatus(c);
    const missing = [];
    if (!u.address) missing.push('住所 / địa chỉ');
    if (u.company && !u.rep_name) missing.push('代表者名 / người đại diện');
    const warn = missing.length ? `<div class="flash error">契約情報が未入力です：${h(missing.join('、'))} → <a href="#/admin/accounts/${h(id)}">アカウント編集 / Sửa tài khoản</a></div>` : '';
    const seal = sealUrl();
    let act = '';
    if (status === 'none') act = `<form data-action="contractIssue" data-id="${h(id)}" class="inline"><button class="btn primary">📨 押印して発行<small>Đóng dấu NASON & phát hành cho đối tác ký</small></button></form>`;
    if (status === 'sent') act = `<span class="hint">${c.kou_sign ? 'NASON押印済・' : ''}パートナーの署名待ち / Chờ đối tác ký</span> <button class="btn" data-act="contractCancel" data-id="${h(id)}" data-confirm2>取消<small>Huỷ phát hành</small></button>`;
    if (status === 'signed') act = `<form data-action="contractConclude" data-id="${h(id)}" class="inline" data-confirm><button class="btn primary">🖋 締結する（会社印を押す）<small>Xác nhận ký kết & đóng dấu</small></button></form>${seal ? '' : ' <small class="warn">先に会社印を登録 / Tải ảnh con dấu trước ở <a href="#/admin/contracts">契約書管理</a></small>'}`;
    if (status !== 'none' && status !== 'sent') act += ` <form data-action="contractIssue" data-id="${h(id)}" class="inline" data-confirm><button class="btn">↻ 再発行<small>Phát hành lại (bản cũ lưu vào lịch sử)</small></button></form>`;

    const sealCard = !seal ? `<div class="card sealneed"><h2>会社印が未登録です<small>Chưa có con dấu NASON — tải lên 1 lần để đóng dấu hợp đồng</small></h2>
      <p class="hint">契約書は発行時にNASON HOMEの印を自動で押します。印影の画像（con-dau-NASON-HOME.png など）を選択してください。<br>Hợp đồng được đóng dấu NASON tự động khi phát hành. Chọn file ảnh con dấu (vd con-dau-NASON-HOME.png).</p>
      <input type="file" id="sealfile" accept="image/png,image/jpeg"></div>` : '';
    return `<div class="head"><h1>${h(u.name)}<small>商材取次契約書</small></h1>${cstatusBadge(status)}${deliveryBadge(id)}</div>
      <p><a class="btn small" href="#/admin/contracts">← 契約書管理 / Danh sách</a> <a class="btn small" href="#/admin/accounts/${h(id)}">アカウント / Tài khoản</a> <a class="btn small" href="#/chat/dm/${h(id)}">💬 チャット</a></p>
      ${warn}${sealCard}<div class="card"><div class="btns">${act}${c ? `<button class="btn" data-act="pdfContract" data-id="${h(id)}">⬇ PDF</button><button class="btn" data-act="xlsxContract" data-id="${h(id)}">⬇ Excel</button>` : ''}</div>
      ${status === 'none' ? '<p class="hint">下は発行前のプレビューです。発行するとNASONの印が押され、パートナーに通知されます。パートナーが署名した時点で契約締結となります。<br>Bản xem trước — khi phát hành, hợp đồng được đóng dấu NASON và gửi cho đối tác; đối tác ký xong là hợp đồng có hiệu lực.</p>' : ''}</div>
      <div class="card contract">${contractBlocks(preview).join('')}</div>${archiveList(id)}`;
  },

      <tbody>${rows.length ? rows.map((r) => `<tr><td>${h(fmtTime(r.at))}</td><td>${h(userName(r.by))}</td><td>${h(label(r.action))}</td><td>${h(r.target || '')}</td><td class="hint wrapcell">${h(r.detail || '')}</td></tr>`).join('') : '<tr><td colspan="5" class="empty">記録なし / Chưa có</td></tr>'}</tbody></table></div>`;

function archiveList(ownerId) {
  const arch = Object.entries((S.contractArchive || {})[ownerId] || {}).map(([k, v]) => ({ k, ...v })).sort((a, b) => (b.archived_at || 0) - (a.archived_at || 0));
  if (!arch.length) return '';

    <tbody>${arch.map((a) => `<tr><td>${h(fmtTime(a.issued_at))}</td><td>${cstatusBadge(effStatus(a))}${a.archive_reason ? `<small>${h(a.archive_reason)}</small>` : ''}</td><td>${h(fmtTime(a.archived_at))}</td><td><button class="btn small" data-act="pdfContract" data-id="${h(ownerId)}" data-arch="${h(a.k)}">⬇ PDF</button></td></tr>`).join('')}</tbody></table></div>`;

function roleRadios(current, disabled) {
  const dis = disabled ? ' disabled' : '';
  return `<div class="radios">
    <label><input type="radio" name="role" value="staff"${current === 'staff' ? ' checked' : ''}${dis}> 社員<small>Nhân viên NASON — HH theo bảng nhân viên</small></label>
    <label><input type="radio" name="role" value="partner"${current === 'partner' ? ' checked' : ''}${dis}> パートナー<small>Đối tác / CTV — HH theo bảng đối tác</small></label>
    <label><input type="radio" name="role" value="kanri"${current === 'kanri' ? ' checked' : ''}${dis}> 管理者<small>Quản trị — toàn bộ + quản lý</small></label></div>`;

function adminSummary(month) {
  const lines = linesForMonth(appList(), month);
  const by = {};
  lines.forEach((l) => { (by[l.owner] = by[l.owner] || []).push(l); });
  const rows = Object.entries(by).map(([id, ls]) => ({ id, ...(S.users[id] || { name: '—' }), ...totalsOf(ls) })).sort((a, b) => b.total - a.total);
  const all = totalsOf(lines);
  return { rows, lines, totals: { count: all.count, company: all.company_sum, one: all.one, payout: all.total } };
}

// ===================== Thao tác (ghi dữ liệu) =====================
function formErrors(form, errs) {
  let box = form.querySelector(':scope > .flash.error');
  if (!box) { box = document.createElement('div'); box.className = 'flash error'; form.prepend(box); }
  const list = Array.isArray(errs) ? errs : [errs];
  box.innerHTML = list.length === 1 ? h(list[0]) : '<ul>' + list.map((m) => `<li>${h(m)}</li>`).join('') + '</ul>';
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function busy(form, on) { form.querySelectorAll('button').forEach((b) => { b.disabled = on; }); }
function audit(action, target, detail) {
  const k = B.newKey(P.audit);
  return { [`${P.audit}/${k}`]: compact({ by: uid(), at: B.TS, action, target: target || '', detail: detail ? String(detail).slice(0, 500) : '' }) };
}
function historyEntry(owner, id, from, to, comment) {
  const k = B.newKey(`${P.apps}/${owner}/${id}/history`);
  return { [`${P.apps}/${owner}/${id}/history/${k}`]: compact({ by: uid(), name: S.me.name, at: B.TS, from: from || '', to: to || '', comment: comment || '' }) };
}
function sysMsg(owner, id, body) {
  const k = B.newKey(`${P.chatApp}/${owner}/${id}`);
  return { [`${P.chatApp}/${owner}/${id}/${k}`]: { by: uid(), name: S.me.name, side: 'system', body, at: B.TS } };
}
function rewardUpdates(a, status, startedAt, cancelledAt, ov) {
  const owner = S.users[a.owner] || (a.owner === uid() ? S.me : {});
  const cat = S.catalog[a.form.product] || {};
  const fee = S.fees[a.form.product];
  const o = ov || { company: a.actual_fee, partner: a.actual_partner };
  const r = computeReward(owner.role, cat, fee, a.form.op_taken, S.settings, o);
  const base = `${P.apps}/${a.owner}/${a.id}/state`;
  const claw = status === 'clawback' ? computeClawback(startedAt, cancelledAt, r.one, fee) : 0;
  return {
    r,
    updates: {
      [`${base}/reward_role`]: owner.role || null,
      [`${base}/reward_amount`]: r.one,
      [`${base}/reward_stock`]: r.stock || null,
      [`${base}/reward_pending`]: r.pending || null,
      [`${base}/clawback_amount`]: claw || null,
      [`${P.appadmin}/${a.id}/company_amount`]: r.company,
    },
  };
}

// ---- Đặt MK mới trong hệ thống (không email) — dùng chung cho thẻ 🔐 パスワード設定 và nút 🔐 再設定 ở danh sách ----
// Trả '' khi xong (đã chuyển sang màn hình kết quả có MK mới + tin nhắn gửi), hoặc câu báo lỗi.
async function pwSetCore(id, typed) {
  const u = S.users[id];
  if (!vaultOk(id, u) || u.active === false) return 'このアカウントには設定できません / Không đặt được cho tài khoản này';
  let cur = '';
  try { const v = await B.get(`${P.pwvault}/${id}`); cur = v && typeof v.pw === 'string' ? v.pw : ''; } catch (e) { return errText(e); }
  if (!cur) return '保管されたパスワードがないため、システム上では再設定できません（本人が一度ログインすると保管されます）。/ Chưa có MK nào được lưu cho tài khoản này nên chưa đặt lại được — khi người này đăng nhập 1 lần, hệ thống sẽ tự lưu.';
  const next = typed || tempPassword();
  if (next === cur) return '今のパスワードと同じです。別のパスワードにしてください / Trùng với MK hiện tại — hãy chọn MK khác';
  try { await B.setUserPassword(u.email, cur, next); } catch (e) {
    return /wrong-password|invalid-credential|INVALID_LOGIN|user-not-found/i.test(errCode(e))
      ? '保管されているパスワードが実際のパスワードと一致しません（本人がシステム外で変更した可能性）。本人が新しいパスワードで一度ログインすると自動で一致します。/ MK đang lưu không khớp MK thật (người dùng đã đổi MK ngoài hệ thống). Khi họ đăng nhập 1 lần bằng MK mới, kho sẽ tự khớp lại.'
      : errText(e);
  }
  // Đã đổi MK thật → ghi kho + nhật ký. Lỗi ở bước này không được làm mất MK mới: vẫn hiện màn hình kết quả kèm cảnh báo.
  let warn = '';
  try { await B.update({ [`${P.pwvault}/${id}`]: { pw: next, at: B.TS, by: uid() }, ...audit('account_pw_set', u.email, typed ? 'manual' : 'auto') }); } catch (e) { warn = errText(e); }
  S.tempCard = { email: u.email, name: u.name, pw: next, role: u.role, reset: true, id, typed: !!typed };
  if (warn) setFlash('error', 'パスワードは変更済みですが、記録の保存に失敗しました / Đã đổi MK nhưng chưa ghi được vào kho / nhật ký: ' + warn);
  go('#/admin/accounts/created');
  return '';
}

// ---- Mã khôi phục tài khoản tổng (f17) ----
// Vân tay khoá công khai lưu ở trình duyệt của chủ tài khoản: nếu dữ liệu trên Firebase bị người khác tráo khoá → KHÔNG mã hoá MK bằng khoá lạ, báo chủ tài khoản.
const REC_LS = 'dgw_rec_fp';
function recLocalGet() { try { return localStorage.getItem(REC_LS) || ''; } catch (_) { return ''; } }
function recLocalSet(fp) { try { if (fp) localStorage.setItem(REC_LS, fp); else localStorage.removeItem(REC_LS); } catch (_) { /* bỏ qua */ } }
// Tài khoản tổng vừa đăng nhập / đổi MK / khôi phục → mã hoá MK mới bằng khoá công khai (không cần mã khôi phục), để mã khôi phục luôn dùng được
async function syncRecovery(pw) {
  if (!pw || !S.me || !S.me.is_owner) return;
  const recovered = S.recovered; S.recovered = false;
  try {
    const rec = await B.get(P.recovery);
    if (!rec || !rec.pub) { if (recovered) B.update(audit('owner_recover', S.me.email)).catch(() => {}); return; }
    const fp = await recFingerprint(rec.pub);
    const local = recLocalGet();
    if (local && local !== fp) { S.recWarn = true; scheduleRender(); return; }
    if (!local) recLocalSet(fp);
    const ctpw = await recEncryptPw(rec.pub, pw);
    await B.update({ [`${P.recovery}/ctpw`]: ctpw, [`${P.recovery}/at`]: B.TS, ...(recovered ? audit('owner_recover', S.me.email) : {}) });
  } catch (e) { console.warn('[dgw] recovery sync', e); }
}
function recErrText(e) {
  const c = errCode(e);
  if (/rec_bad_code/.test(c)) return '復旧コードが違います / Mã khôi phục không đúng';
  if (/rec_none/.test(c)) return '復旧コードが設定されていません。NASON の技術担当にご連絡ください / Tài khoản tổng chưa tạo mã khôi phục';
  if (/rec_pw_too_long/.test(c)) return 'パスワードが長すぎます（全角なら短めに）/ Mật khẩu quá dài';
  if (/crypto_unavailable/.test(c)) return 'このブラウザでは使えません。最新の Safari / Chrome で開いてください / Trình duyệt không hỗ trợ — mở bằng Safari / Chrome mới';
  if (/wrong-password|invalid-credential|INVALID_LOGIN|user-not-found|invalid-email/i.test(c)) return 'メールが違うか、パスワードがシステム外で変更されています / Email không đúng (hoặc MK đã bị đổi ngoài hệ thống)';
  return errText(e);
}

// ---- Trang link CTV (không đăng nhập) ----
// Đọc: đúng 1 nút link theo mã + danh mục gói. Ghi: tạo mới 1 đơn (xem ACTIONS.ctvApply). Tất cả đi qua B.pub (auth = null).
// Mạng chập chờn: không để trang CTV treo mãi ở "Đang tải…" (Firebase chờ kết nối vô hạn). window.__DGW_CTV_MS__ chỉ để test rút ngắn thời gian chờ.
function withTimeout(p, ms, code) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(Object.assign(new Error(code), { code })), ms);
    p.then((v) => { clearTimeout(t); res(v); }, (e) => { clearTimeout(t); rej(e); });
  });
}
const ctvMs = (def) => (typeof window !== 'undefined' && window.__DGW_CTV_MS__) || def;
async function loadCtvPage(c) {
  try {
    const link = await withTimeout(B.pub.get(`${P.ctv}/${c.owner}/${c.token}`), ctvMs(15000), 'network_timeout');
    if (S.ctvPage !== c) return;
    if (!link || typeof link !== 'object') c.state = 'invalid';
    else if (link.on !== true) { c.link = link; c.state = 'closed'; }
    else {
      const cat = await withTimeout(B.pub.get(P.catalog), ctvMs(15000), 'network_timeout');
      if (S.ctvPage !== c) return;
      c.link = link; c.catalog = cat || {}; c.state = 'ok';
    }
  } catch (e) {
    if (S.ctvPage !== c) return;
    c.state = 'error';
    c.err = /PERMISSION_DENIED|permission/i.test(errCode(e)) ? 'リンクを確認できません。リンクをくれた方にご連絡ください。 / Chưa xác nhận được link (hệ thống chưa sẵn sàng) — hãy báo người gửi link cho bạn.' : errText(e);
  }
  if (S.ctvPage === c && currentRoute().name === 'ctv') render();
}
function ctvSendError(e) {
  if (/send_timeout/.test(errCode(e))) return '通信が遅れています。送信は完了している場合があります。数分待って、リンクをくれた方に届いたかご確認ください（二重送信を防ぐため）。 / Mạng chậm — đơn CÓ THỂ đã gửi được. Đợi 1–2 phút và hỏi người gửi link xem đã nhận chưa rồi hãy gửi lại (tránh gửi trùng).';
  return /PERMISSION_DENIED|permission/i.test(errCode(e))
    ? '送信できませんでした。リンクが停止された可能性があります。リンクをくれた方にご確認ください。 / Không gửi được — link có thể vừa bị tắt. Hãy hỏi người gửi link cho bạn.'
    : errText(e);
}
