      if (d.op_taken != null) formData.op_taken = d.op_taken;
      const updates = {
        [`${P.apps}/${owner}/${id}/form`]: formData,
        [`${P.apps}/${owner}/${id}/state`]: { status: 'received', owner, app_no: appNo, applied_at: today(), updated_at: B.TS },
        ...historyEntry(owner, id, '', 'received', '新規申込 / Đơn mới'),
        ...audit('app_create', appNo, d.product),
      };
      await B.update(updates);
      S.draft = null;
      setFlash('ok', '申込を受け付けました。進捗はこの画面とチャットでお知らせします / Đã gửi đơn. Tiến độ sẽ báo ở đây và trong chat.');
      go(`#/apps/${owner}/${id}`);
    } catch (e) { busy(form, false); formErrors(form, errText(e)); }
  },

  async editApp(form, fd) {
    const a = findApp(form.dataset.owner, form.dataset.id);
    if (!a) return;
    const { d, errs } = parseAppForm(fd, catalogList(), { keepProduct: a.form.product });
    if (errs.length) return formErrors(form, errs);
    const admin = isAdmin();
    const resubmit = !admin && a.state.status === 'incomplete';
    const formData = compact({ category: d.category, product: d.product, product_label: d.product_label, meigi_type: d.meigi_type, cust_name: d.cust_name, cust_kana: d.cust_kana, company_name: d.company_name, birth_date: d.birth_date, phone: d.phone, email: d.email, postal: d.postal, address: d.address, building: d.building, details: d.details, note: d.note, not_vn: d.not_vn || null });
    if (d.op_taken != null) formData.op_taken = d.op_taken;
    const base = `${P.apps}/${a.owner}/${a.id}`;
    const updates = {
      [`${base}/form`]: formData,
      [`${base}/state/updated_at`]: B.TS,
      ...historyEntry(a.owner, a.id, resubmit ? 'incomplete' : '', resubmit ? 'received' : '', resubmit ? '修正・再提出 / Đã bổ sung và gửi lại' : admin ? '管理者が内容を修正 / Quản trị sửa nội dung' : '内容を修正 / Sửa nội dung'),
      ...audit('app_update', a.state.app_no),
    };
    if (resubmit) { updates[`${base}/state/status`] = 'received'; Object.assign(updates, sysMsg(a.owner, a.id, '【再提出】不備を修正して再提出されました / Đơn đã được bổ sung và gửi lại')); }
    if (admin && DONE_LIKE.includes(a.state.status)) {
      Object.assign(updates, rewardUpdates({ ...a, form: formData }, a.state.status, a.state.started_at, a.state.cancelled_at).updates);
    }
    busy(form, true);
    try {
      await B.update(updates);
      setFlash('ok', resubmit ? '修正内容で再提出しました / Đã sửa và gửi lại đơn' : '保存しました / Đã lưu');
      go(`#/apps/${a.owner}/${a.id}`);
    } catch (e) { busy(form, false); formErrors(form, errText(e)); }
  },

  async withdraw(form) {
    const a = findApp(form.dataset.owner, form.dataset.id);
    if (!a || a.state.status !== 'received') return;
    const base = `${P.apps}/${a.owner}/${a.id}/state`;
    try {
      await B.update({ [`${base}/status`]: 'cancelled', [`${base}/updated_at`]: B.TS, ...historyEntry(a.owner, a.id, 'received', 'cancelled', '申込者が取下げ / Người gửi rút đơn'), ...sysMsg(a.owner, a.id, '【取下げ】申込者が申込を取り下げました / Người gửi đã rút đơn'), ...audit('app_withdraw', a.state.app_no) });
      setFlash('ok', '申込を取り下げました / Đã rút đơn'); render();
    } catch (e) { setFlash('error', errText(e)); render(); }
  },

  async status(form, fd) {
    const a = findApp(form.dataset.owner, form.dataset.id);
    if (!a) return;
    const to = clean(fd.get('status'), 20);
    const comment = clean(fd.get('comment'), 2000);
    const startedAt = clean(fd.get('started_at'), 10);
    const cancelledAt = clean(fd.get('cancelled_at'), 10);
    const errs = [];
    if (!STATUS[to]) errs.push('状態が正しくありません / Trạng thái không hợp lệ');
    if (to === 'done' && !isYmd(startedAt)) errs.push('開通・供給開始日を入力してください / Nhập ngày mở / bắt đầu cấp');
    if (to === 'clawback') {
      if (!isYmd(startedAt)) errs.push('開通日が必要です / Cần có ngày mở trước');
      if (!isYmd(cancelledAt)) errs.push('解約日を入力してください / Nhập ngày KH huỷ');
      else if (cancelledAt < startedAt) errs.push('解約日は開通日以降にしてください / Ngày huỷ phải sau ngày mở');
    }
    if (to === 'incomplete' && !comment) errs.push('不備の内容をコメントに入力してください / Ghi rõ nội dung thiếu / sai vào ô ghi chú');
    const actualFee = intOrNull(fd.get('actual_fee'));
    const actualPartner = intOrNull(fd.get('actual_partner'));
    if (DONE_LIKE.includes(to) && isRangeFee(S.fees[a.form.product]) && actualFee == null) errs.push(`変動単価の商材です。会社受取（実績）を入力してください（${feeText(S.fees[a.form.product])}）/ Gói giá khoảng — nhập số tiền thực tế công ty nhận`);
    if (errs.length) return formErrors(form, errs);
    const from = a.state.status;
    const base = `${P.apps}/${a.owner}/${a.id}/state`;
    const updates = { [`${base}/status`]: to, [`${base}/updated_at`]: B.TS };
    if (DONE_LIKE.includes(to)) {
      updates[`${base}/started_at`] = startedAt;
      updates[`${base}/cancelled_at`] = to === 'clawback' ? cancelledAt : null;
      updates[`${P.appadmin}/${a.id}/actual_fee`] = actualFee;
      updates[`${P.appadmin}/${a.id}/actual_partner`] = actualPartner;
      Object.assign(updates, rewardUpdates(a, to, startedAt, cancelledAt, { company: actualFee, partner: actualPartner }).updates);
    } else {
      for (const k of ['started_at', 'cancelled_at', 'reward_role', 'reward_amount', 'reward_stock', 'reward_pending', 'clawback_amount']) updates[`${base}/${k}`] = null;
      updates[`${P.appadmin}/${a.id}/company_amount`] = null;
      if (to === 'incomplete') updates[`${base}/incomplete_reason`] = comment;
    }
    Object.assign(updates, historyEntry(a.owner, a.id, from, to, comment || (to === 'done' ? `開通・供給開始 ${startedAt}` : to === 'clawback' ? `解約日 ${cancelledAt}` : '')));
    if (fd.get('notify') === '1') {
      let msg = `【状態変更 / Đổi trạng thái】${STATUS[from].jp} → ${STATUS[to].jp}（${STATUS[from].vi} → ${STATUS[to].vi}）`;
      if (to === 'done') msg += `\n開通・供給開始日 / Ngày mở: ${startedAt}`;
      if (to === 'clawback') msg += `\n解約日 / Ngày huỷ: ${cancelledAt}`;
      if (comment) msg += `\n${comment}`;
      Object.assign(updates, sysMsg(a.owner, a.id, msg));
    }
    Object.assign(updates, audit('app_status', a.state.app_no, `${from} → ${to}`));
    busy(form, true);
    try { await B.update(updates); setFlash('ok', '更新しました / Đã cập nhật'); render(); } catch (e) { busy(form, false); formErrors(form, errText(e)); }
  },

  async note(form, fd) {
    try { await B.update({ [`${P.appadmin}/${form.dataset.id}/admin_note`]: clean(fd.get('admin_note'), 2000) || null }); setFlash('ok', '保存しました / Đã lưu'); render(); } catch (e) { formErrors(form, errText(e)); }
  },

  async recalc(form) {
    const a = findApp(form.dataset.owner, form.dataset.id);
    if (!a) return;
    const ru = rewardUpdates(a, a.state.status, a.state.started_at, a.state.cancelled_at);
    try { await B.update({ ...ru.updates, ...audit('app_recalc', a.state.app_no, `${a.state.reward_amount} → ${ru.r.one}`) }); setFlash('ok', '報酬を再計算しました / Đã tính lại hoa hồng'); render(); } catch (e) { setFlash('error', errText(e)); render(); }
  },

  async chat(form, fd) {
    const box = form.closest('.chat');
    const body = clean(fd.get('body'), 2000);
    if (!body) return;
    const { kind, owner, app } = box.dataset;
    const path = kind === 'app' ? `${P.chatApp}/${owner}/${app}` : `${P.chatDm}/${owner}`;

    busy(form, true);

    } catch (e) { alertBox(box, errText(e)); }
    busy(form, false);
    renderChats();

  async profile(form, fd) {
    const name = clean(fd.get('name'), 60);
    if (!name) return formErrors(form, '表示名を入力してください / Nhập tên hiển thị');
    const me = uid();
    const updates = { [`${P.users}/${me}/name`]: name, [`${P.users}/${me}/phone`]: clean(fd.get('phone'), 30) || null };
    let bankChanged = false;
    if (S.me.role !== 'kanri') {
      const nb = compact({ name: clean(fd.get('bank_name'), 60), branch: clean(fd.get('bank_branch'), 60), type: clean(fd.get('bank_type'), 10), number: clean(fd.get('bank_number'), 20), holder: clean(fd.get('bank_holder'), 60) });
      const ob = compact({ ...(S.me.bank || {}) });
      const key = (o) => ['name', 'branch', 'type', 'number', 'holder'].map((k) => String(o[k] || '')).join('\u0001');
      bankChanged = key(nb) !== key(ob);
      updates[`${P.users}/${me}/bank`] = Object.keys(nb).length ? nb : null;
    }
    Object.assign(updates, audit('profile_update', S.me.email));
    if (bankChanged) {
      // Báo về admin: nhật ký + tin nhắn vào khung chat của chính người này (admin thấy huy hiệu chưa đọc). KHÔNG đưa số tài khoản vào chat.
      const done = !bankMissing(updates[`${P.users}/${me}/bank`]).length;
      Object.assign(updates, audit('bank_update', S.me.email, done ? 'complete' : 'partial'));
      Object.assign(updates, dmMsg(me, 'user', done
        ? '【振込先】報酬の振込先口座を登録・更新しました。「アカウント管理」で内容をご確認ください。\nĐã cập nhật tài khoản ngân hàng nhận hoa hồng — xin kiểm tra ở mục Quản lý tài khoản.'
        : '【振込先】振込先口座を一部更新しました（まだ未入力の項目があります）。「アカウント管理」でご確認ください。\nĐã lưu một phần thông tin ngân hàng (còn thiếu một số mục) — xem ở Quản lý tài khoản.'));
    }
    try { await B.update(updates); setFlash('ok', bankChanged ? '保存しました。振込先をNASONに反映・通知しました / Đã lưu và đã cập nhật về NASON.' : '保存しました / Đã lưu'); render(); } catch (e) { formErrors(form, errText(e)); }
  },

  async password(form, fd) {
    const cur = String(fd.get('current') || '');
    const pw = String(fd.get('password') || '');
    const errs = [];
    if (pw.length < 6) errs.push('パスワードは6文字以上 / Mật khẩu tối thiểu 6 ký tự');
    if (pw !== fd.get('password2')) errs.push('確認用パスワードが一致しません / Hai lần nhập mật khẩu mới không khớp');
    if (pw && pw === cur) errs.push('今と違うパスワードにしてください / Mật khẩu mới phải khác mật khẩu cũ');
    if (errs.length) return formErrors(form, errs);
    busy(form, true);
    try {
      await B.changePassword(cur, pw);
      const updates = audit('password_change', S.me.email);
      if (S.me.must_change_pw) updates[`${P.users}/${uid()}/must_change_pw`] = false;
      await B.update(updates);
      if (S.me.is_owner) syncRecovery(pw); // tài khoản tổng: cập nhật bản mã hoá cho mã khôi phục (không lưu MK rõ)
      else B.update({ [`${P.pwvault}/${uid()}`]: { pw, at: B.TS, by: uid() } }).catch(() => {}); // kho mật khẩu: lỗi (Rules cũ…) bỏ qua
      S.me.must_change_pw = false;
      setFlash('ok', 'パスワードを変更しました / Đã đổi mật khẩu');
      go('#/');
    } catch (e) { busy(form, false); formErrors(form, /wrong-password|invalid-credential|INVALID_LOGIN/i.test(errCode(e)) ? '現在のパスワードが違います / Mật khẩu hiện tại không đúng' : errText(e)); }
  },

  async accountCreate(form, fd) {
    const email = clean(fd.get('email'), 120).toLowerCase();
    const name = clean(fd.get('name'), 60);
    const role = ['kanri', 'staff', 'partner'].includes(fd.get('role')) ? fd.get('role') : 'partner';
    const typed = String(fd.get('password') || '').trim();
    const errs = [];
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errs.push('メールアドレスの形式が正しくありません / Email không hợp lệ');
    if (!name) errs.push('表示名を入力してください / Nhập tên hiển thị');
    if (typed && typed.length < 6) errs.push('パスワードは6文字以上（空欄なら自動作成）/ Mật khẩu tối thiểu 6 ký tự (để trống thì hệ thống tự tạo)');
    if (typed.length > 64) errs.push('パスワードは64文字以内 / Mật khẩu tối đa 64 ký tự');
    const prof = compact({ email, name, role, company: clean(fd.get('company'), 80), rep_name: clean(fd.get('rep_name'), 60), address: clean(fd.get('address'), 200), phone: clean(fd.get('phone'), 30) });
    if (role === 'partner' && issueMissing(prof)) errs.push(`パートナーは契約書に必要な「${issueMissing(prof)}」を入力してください / Đối tác cần nhập ${prof.address ? 'người đại diện' : 'địa chỉ'} để phát hành hợp đồng`);
    if (errs.length) return formErrors(form, errs);
    busy(form, true);
    const pw = typed || tempPassword();
    const seal = sealUrl();
    try {
      const newId = await B.createUser(email, pw);
      const updates = { [`${P.users}/${newId}`]: { ...prof, active: true, created_at: B.TS, created_by: uid() }, ...audit('account_create', email, role) };
      updates[`${P.pwvault}/${newId}`] = { pw, at: B.TS, by: uid() }; // kho mật khẩu (chỉ quản trị đọc) — f17: cả quản trị phụ
      const autoIssue = role === 'partner' && !!seal;
      if (autoIssue) Object.assign(updates, issueUpdates(newId, prof, seal));
      await B.update(updates);
      S.tempCard = { email, name, pw, role, contract: autoIssue, typed: !!typed };
      go('#/admin/accounts/created');
    } catch (e) { busy(form, false); formErrors(form, errText(e)); }
  },

  // Quản trị đặt MK mới cho đối tác / nhân viên (/ quản trị phụ — chỉ tài khoản tổng): dùng MK đang lưu trong kho để đăng nhập ngầm (app phụ) rồi đổi sang MK mới
  async pwSet(form, fd) {
    const typed = String(fd.get('password') || '').trim();
    const errs = [];
    if (typed && typed.length < 6) errs.push('パスワードは6文字以上（空欄なら自動作成）/ Mật khẩu tối thiểu 6 ký tự (để trống thì hệ thống tự tạo)');
    if (typed.length > 64) errs.push('パスワードは64文字以内 / Mật khẩu tối đa 64 ký tự');
    if (errs.length) return formErrors(form, errs);
    busy(form, true);
    const err = await pwSetCore(form.dataset.id, typed);
    if (err) { busy(form, false); formErrors(form, err); }
  },

  async accountUpdate(form, fd) {
    const id = form.dataset.id;
    const u = S.users[id];
    if (!u) return;
    const name = clean(fd.get('name'), 60);
    if (!name) return formErrors(form, '表示名を入力してください / Nhập tên hiển thị');
    const self = id === uid();
    const role = u.is_owner || self ? u.role : (['kanri', 'staff', 'partner'].includes(fd.get('role')) ? fd.get('role') : u.role);
    const base = `${P.users}/${id}`;
    const updates = { [`${base}/name`]: name, [`${base}/company`]: clean(fd.get('company'), 80) || null, [`${base}/phone`]: clean(fd.get('phone'), 30) || null, [`${base}/rep_name`]: clean(fd.get('rep_name'), 60) || null, [`${base}/address`]: clean(fd.get('address'), 200) || null, [`${base}/role`]: role, [`${P.useradmin}/${id}/memo`]: clean(fd.get('memo'), 1000) || null };
    if (u.role !== 'kanri') {
      const bank = compact({ name: clean(fd.get('bank_name'), 60), branch: clean(fd.get('bank_branch'), 60), type: clean(fd.get('bank_type'), 10), number: clean(fd.get('bank_number'), 20), holder: clean(fd.get('bank_holder'), 60) });
      updates[`${base}/bank`] = Object.keys(bank).length ? bank : null;
    }
    Object.assign(updates, audit('account_update', u.email, role !== u.role ? `${u.role} → ${role}` : ''));
    try { await B.update(updates); setFlash('ok', '保存しました / Đã lưu'); render(); } catch (e) { formErrors(form, errText(e)); }
  },

};

const CLICKS = {
  // Kho mật khẩu: hiện / ẩn (mỗi lần hiện được ghi vào nhật ký) và đọc lại
  vaultToggle(btn) {
    const id = btn.dataset.id;
    const u = S.users[id];
    if (!vaultOk(id, u)) return;
    const showing = !S.vaultShow[id];
    S.vaultShow[id] = showing;
    if (showing) B.update(audit('pwvault_view', u.email)).catch(() => {});
    refreshVault(id);
  },
  vaultReload(btn) {
    const id = btn.dataset.id;
    if (!vaultOk(id, S.users[id])) return;
    S.vaultShow[id] = false;
    refreshVault(id);
    loadVault(id);
  },
  async logout() { unsubscribeAll(); await B.signOut(); location.hash = '#/'; },
  async accountReset(btn) {
    const u = S.users[btn.dataset.id];
    if (!u) return;
    try { await B.sendReset(u.email); await B.update(audit('account_reset_pw', u.email)); setFlash('ok', `再設定メールを送信しました / Đã gửi email đặt lại mật khẩu tới ${u.email}`); } catch (e) { setFlash('error', errText(e)); }
    render();
  },
  async accountToggle(btn) {
    const id = btn.dataset.id;
    const u = S.users[id];
    if (!u || u.is_owner || id === uid()) return;
    const disabling = u.active !== false;
    try {
      await B.update({
        [`${P.users}/${id}/active`]: !disabling,
        [`${P.users}/${id}/disabled_at`]: disabling ? B.TS : null,
        [`${P.users}/${id}/disabled_by`]: disabling ? uid() : null,
        ...audit(disabling ? 'account_disable' : 'account_enable', u.email),
      });
      setFlash('ok', disabling ? `${u.name} を停止し、アーカイブに移動しました / Đã khoá và chuyển vào Lưu trữ.` : `${u.name} を復元しました / Đã khôi phục — tài khoản quay lại danh sách đang dùng.`);
      if (!btn.dataset.stay) { go(disabling ? '#/admin/accounts?tab=archive' : '#/admin/accounts'); return; }
    } catch (e) { setFlash('error', errText(e)); }
    render();
  },
  // Xoá đơn = chuyển form + state sang dgw/apptrash/<id> (lịch sử + chat giữ nguyên tại chỗ). Chỉ quản trị; đơn Hoàn tất không xoá được.
  async appDelete(btn) {
    if (!isAdmin()) return;
    const a = findApp(btn.dataset.owner, btn.dataset.id);
    if (!a) return;
    if (DONE_LIKE.includes(a.state.status)) {
      setFlash('error', '完了済み（報酬計上あり）の申込は削除できません。先に状態を「キャンセル」へ変更してください / Đơn đã Hoàn tất không xoá được — hãy đổi sang キャンセル trước.');
      render();
      return;
    }
    const no = a.state.app_no;
    const cust = a.form.cust_name || '';
    const base = `${P.apps}/${a.owner}/${a.id}`;
    try {
      await B.update({
        [`${base}/form`]: null,
        [`${base}/state`]: null,
        [`${P.appTrash}/${a.id}`]: { owner: a.owner, form: a.form, state: a.state, deleted_at: B.TS, deleted_by: uid(), deleted_by_name: S.me.name },
        ...historyEntry(a.owner, a.id, '', '', '削除（削除済みへ移動）/ Đã xoá, chuyển sang mục Đã xoá'),
        ...dmMsg(a.owner, 'admin', `【削除】申込 ${no}（${cust}）を削除しました / Đã xoá đơn ${no} (${cust}). ご不明な点はこのチャットへ / Có thắc mắc xin nhắn tại đây.`),
        ...audit('app_delete', no, `${cust} / ${a.state.status}`),

function issueMissing(u) {
  const m = [];
  if (!u.address) m.push('住所');
  if (u.company && !u.rep_name) m.push('代表者名');

// Các thay đổi để phát hành 1 hợp đồng (NASON đóng dấu sẵn); bản cũ (nếu có) chuyển vào lưu trữ
function issueUpdates(id, u, seal) {
  const old = (S.contracts || {})[id];
  const updates = {
    [`${P.contracts}/${id}`]: { ver: CONTRACT_V1.ver, status: 'sent', issued_at: B.TS, issued_by: uid(), otsu: otsuFromUser(u), kou: KOU, kou_sign: { at: B.TS, by: uid(), name: S.me.name, seal, pre: true } },
    ...dmMsg(id, 'admin', '【契約書】商材取次契約書を発行しました（NASON HOME 押印済）。メニューの「契約書」から内容をご確認のうえ署名してください。署名した時点で契約締結となります。\nNASON đã gửi hợp đồng môi giới (đã đóng dấu) — vào mục 「契約書」 đọc và ký là hợp đồng có hiệu lực.'),
    ...audit('contract_issue', u.email, old && old.status ? `再発行 (${effStatus(old)})` : ''),
  };
  if (old && old.status) Object.assign(updates, archiveEntry(id, old, '再発行 / phát hành lại'));
  return updates;
}
// Phát hành (hoặc phát hành lại) hợp đồng cho 1 đối tác. Trả về '' nếu xong, hoặc câu báo lỗi (để hiện cho người dùng thấy lý do rõ ràng — nút không bao giờ bị "xám chết")
async function issueOne(id) {
  const u = S.users[id];
  if (!u || u.role !== 'partner') return 'パートナーのアカウントではありません / Không phải tài khoản đối tác';
  const miss = issueMissing(u);
  if (miss) return `契約情報が未入力です（${miss}）。アカウント編集で入力してください / Thiếu thông tin hợp đồng (${miss}) — nhập ở 「Sửa tài khoản」 rồi phát hành lại`;
  const seal = sealUrl();
  if (!seal) return '会社印が未登録です。「契約書管理」で印影画像を1回だけ登録してください / Chưa có con dấu NASON — tải ảnh con dấu lên 1 lần ở 「契約書管理」';
  try {
    await B.update(issueUpdates(id, u, seal));
    return await verifyIssued([id]);
  } catch (e) { return errText(e); }
}
// Đọc lại từ Firebase để chắc chắn hợp đồng đã nằm ở nhánh của đối tác (không chỉ "ghi không báo lỗi")
async function verifyIssued(ids) {
  for (const id of ids) {
    let v = null;
    try { v = await B.get(`${P.contracts}/${id}`); } catch (e) { return errText(e); }
    if (!v || v.status !== 'sent' || !v.issued_at) return `発行を確認できませんでした（${(S.users[id] || {}).name || id}）。もう一度お試しください / Chưa xác nhận được hợp đồng đã nằm ở tài khoản đối tác — thử phát hành lại`;
  }
  return '';
}
// Ký kết (NASON đóng dấu sau khi đối tác đã ký). Trả về '' nếu xong, hoặc câu báo lỗi
async function concludeOne(id) {
  const c = (S.contracts || {})[id];
  if (!c || c.status !== 'signed' || c.kou_sign) return '締結できる状態ではありません（パートナーの署名後に締結できます）/ Hợp đồng chưa ở trạng thái chờ ký kết (đối tác ký xong mới ký kết được)';
  const seal = sealUrl();
  if (!seal) return '会社印が未登録です。「契約書管理」で印影画像を1回だけ登録してください / Chưa có con dấu NASON — tải ảnh con dấu lên 1 lần ở 「契約書管理」';
  try {
    await B.update({
      [`${P.contracts}/${id}/status`]: 'concluded',
      [`${P.contracts}/${id}/kou_sign`]: { at: B.TS, by: uid(), name: S.me.name, seal },
      ...dmMsg(id, 'admin', '【契約書】契約が締結されました。「契約書」からPDFをダウンロードできます。\nHợp đồng đã ký kết — có thể tải PDF ở mục 「契約書」.'),
      ...audit('contract_conclude', (S.users[id] || {}).email),
    });
    return '';
  } catch (e) { return errText(e); }
}

async function settlePending() {
  const fresh = await B.get(P.fees);
  if (fresh) S.fees = fresh;
  const pend = appList().filter((a) => a.state.reward_pending && DONE_LIKE.includes(a.state.status) && S.fees[a.form.product] && S.fees[a.form.product].partner_fee != null);
  if (!pend.length) return 0;
  const updates = {};
  pend.forEach((a) => Object.assign(updates, rewardUpdates(a, a.state.status, a.state.started_at, a.state.cancelled_at).updates));
  await B.update(updates);
  return pend.length;
}

// Đọc file bảng giá (JSON hoặc Excel "Bảng hoa hồng")
async function readFeesFile(file) {
  const rows = [];
  let catalog = null;
  if (/\.json$/i.test(file.name)) {
    const data = JSON.parse(await file.text());
    // v2: { version, catalog: {code: {...}}, fees: [...] } — thêm / cập nhật cả danh mục gói
    if (data && !Array.isArray(data) && data.fees) {
      catalog = {};
      for (const [code, c] of Object.entries(data.catalog || {})) {
        if (!/^[A-Z0-9_-]{2,30}$/.test(code) || !c || !CATEGORIES[c.category] || !c.provider || !c.plan) continue;
        catalog[code] = compact({ category: c.category, provider: clean(c.provider, 80), meigi: clean(c.meigi, 60), plan: clean(c.plan, 160), sort: Number(c.sort) || 0, conditions: clean(c.conditions, 2000), has_op: !!c.has_op, active: c.active !== false, age_min: intOrNull(c.age_min), age_max: intOrNull(c.age_max), no_switch: c.no_switch ? true : null, ng_vn: c.ng_vn ? true : null });
      }
    }
    const src = data && !Array.isArray(data) && data.fees ? data.fees : data;
    const list = Array.isArray(src) ? src : Object.entries(src).map(([code, v]) => ({ code, ...v }));
    for (const x of list) if (x && x.code) rows.push({ code: String(x.code), company_fee: int0(x.company_fee), deduction: int0(x.deduction), stock_monthly: int0(x.stock_monthly), clawback_rate: Number(x.clawback_rate) || 0, clawback_months: x.clawback_months == null ? 6 : Number(x.clawback_months), note_internal: x.note_internal || '', partner_fee: x.partner_fee == null ? null : int0(x.partner_fee), fee_min: intOrNull(x.fee_min), fee_max: intOrNull(x.fee_max) });
  } else {
    if (typeof XLSX === 'undefined') await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets['Bảng hoa hồng'] || wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
    for (const r of data) {
      const code = String(r[0] || '').trim();
      if (!/^(DIEN|GAS|WIFI)-\d+$/.test(code)) continue;
      rows.push({ code, company_fee: int0(r[6]) + int0(r[7]), deduction: Math.abs(Number(r[9]) || 0), stock_monthly: int0(r[14]), clawback_rate: Number(r[16]) || 0, clawback_months: 6, note_internal: r[17] ? String(r[17]) : '', partner_fee: null });
    }
  }
  const known = (code) => S.catalog[code] || (catalog && catalog[code]);
  return { rows: rows.filter((x) => known(x.code)), catalog, newCodes: catalog ? Object.keys(catalog).filter((c) => !S.catalog[c]) : [] };
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); });
}

function renderChats() {
  document.querySelectorAll('.chat[data-kind]').forEach((box) => {
    const { kind, owner, app } = box.dataset;
    const log = box.querySelector('.chat-log');
    const msgs = threadMsgs(kind, owner, app);
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40 || !log.dataset.n;
    if (String(msgs.length) === log.dataset.n) return;
    log.dataset.n = String(msgs.length);
    log.innerHTML = msgs.length ? msgs.map((m) => {
      const mine = m.by === uid() && m.side !== 'system';
      const name = m.side === 'system' ? 'システム' : m.side === 'admin' ? `NASON（${m.name || ''}）` : (m.name || '');
      return `<div class="msg ${h(m.side)}${mine ? ' mine' : ''}"><div class="meta">${h(name)}  ${h(m.at ? jst(m.at).slice(5, 16) : '')}</div><div class="bubble">${h(m.body)}</div></div>`;
    }).join('') : '<p class="hint">メッセージはまだありません / Chưa có tin nhắn</p>';
    if (atBottom) log.scrollTop = log.scrollHeight;
    const last = msgs[msgs.length - 1];
    const key = threadKey(kind, owner, app);
    if (last && last.at && Number(S.reads[key] || 0) < last.at) {
      S.reads[key] = last.at;
      B.update({ [`${P.reads}/${uid()}/${key}`]: last.at }).catch(() => {});
      renderHeader();
    }
  });
}

      const c = form.querySelector('input[name=category]:checked');
      const cat = c ? c.value : '';
      product.querySelectorAll('optgroup').forEach((g) => { const hide = !!cat && g.dataset.cat !== cat; g.hidden = hide; g.disabled = hide; });
      let o = product.options[product.selectedIndex];
      if (o && o.value && cat && o.dataset.cat !== cat) { product.value = ''; o = product.options[product.selectedIndex]; }
      form.querySelectorAll('.catfields').forEach((s) => { s.hidden = !!cat && s.dataset.for !== cat; });
      const has = o && o.value;
      const np = form.querySelector('#noprod');
      if (np) np.hidden = !cat || !!product.querySelector(`option[data-cat="${cat}"]`);
      cond.hidden = !(has && o.dataset.cond);
      cond.textContent = has ? (o.dataset.cond || '') : '';
      opfield.hidden = !(has && o.dataset.op === '1');
      const ngvn = form.querySelector('#ngvnfield');
      if (ngvn) ngvn.hidden = !(has && o.dataset.ngvn === '1');
      const m = form.querySelector('input[name=meigi_type]:checked');
      const allowed = has ? (o.dataset.meigi || '').split(',') : null;
      warn.hidden = !(m && allowed && allowed.indexOf(m.value) < 0);
      form.querySelectorAll('.corp-only').forEach((el) => { el.hidden = !(m && m.value === 'corp'); });
    };
    form.addEventListener('change', refresh);
    refresh();
    const postal = form.querySelector('#postal');
    postal.addEventListener('change', () => {
      const z = postal.value.replace(/[^0-9]/g, '');
      const addr = form.querySelector('#address');
      if (z.length !== 7 || addr.value) return;
      fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode=' + z).then((x) => x.json()).then((x) => { if (x.results && x.results[0]) { const a = x.results[0]; addr.value = a.address1 + a.address2 + a.address3; } }).catch(() => {});
    });
  }
  const st = document.getElementById('st');
  if (st) {
    const sync = () => {
      document.querySelectorAll('.st-done-only').forEach((el) => { el.hidden = !(st.value === 'done' || st.value === 'clawback'); });
      document.querySelectorAll('.st-claw-only').forEach((el) => { el.hidden = st.value !== 'clawback'; });
    };
    st.addEventListener('change', sync);
    sync();
  }
  const pad = document.getElementById('sigpad');
  if (pad) {
    S.sigpad = initSigPad(pad, () => { S.dirty = true; });
    const clr = document.getElementById('sigclear');
    if (clr) clr.addEventListener('click', () => S.sigpad && S.sigpad.clear());
  } else S.sigpad = null;
  const sf = document.getElementById('sealfile');
  if (sf) {
    sf.addEventListener('change', async () => {
      const file = sf.files[0];
      if (!file) return;
      try {
        const url = await processSeal(file);
        if (url.length > 400000) throw new Error('画像が大きすぎます / Ảnh quá lớn');
        await B.update({ [P.seal]: url, ...audit('seal_update', file.name) });
        setFlash('ok', '会社印を登録しました / Đã lưu con dấu.');
      } catch (e) { setFlash('error', errText(e) || String(e.message || e)); }
      render();
    });
  }
  const ff = document.getElementById('feesfile');
  if (ff) {
    ff.addEventListener('change', async () => {
      const file = ff.files[0];
      if (!file) return;
      try { S.importPreview = { name: file.name, ...(await readFeesFile(file)) }; } catch (e) { setFlash('error', 'ファイルを読めません / Không đọc được file: ' + (e.message || e)); }
      render();
    });
  }
  document.querySelectorAll('input[data-pwtoggle]').forEach((inp) => {
    const wrap = document.createElement('label');
    wrap.className = 'pwtoggle';
    wrap.innerHTML = '<input type="checkbox"> パスワードを表示 / Hiện mật khẩu';
    inp.insertAdjacentElement('afterend', wrap);
    wrap.querySelector('input').addEventListener('change', (e) => {
      inp.form.querySelectorAll('input[type=password],input[data-pwshown]').forEach((x) => {
        if (x.name === 'current') return;
        x.type = e.target.checked ? 'text' : 'password';
        if (e.target.checked) x.setAttribute('data-pwshown', '1'); else x.removeAttribute('data-pwshown');
      });
    });
  });
  document.querySelectorAll('[data-monthnav]').forEach((inp) => inp.addEventListener('change', () => { if (isMonth(inp.value)) go('#' + inp.dataset.monthnav + '?month=' + inp.value); }));
}

// ===================== Sự kiện chung =====================
// Nút "bấm 2 lần": lần 1 đổi nhãn thành もう一度押して確定 (chờ tối đa 6 giây), lần 2 mới thực hiện.
// - giữ nguyên bề rộng nút khi đổi nhãn: nút co lại thì lần bấm thứ 2 (đúng chỗ cũ, thường ở mép trái) trượt ra ngoài nút
// - trong lúc chờ, dữ liệu tự cập nhật không vẽ lại màn hình (scheduleRender kiểm tra armedNow) — vẽ lại thì nút mất trạng thái chờ
function armed(el, labelHtml) {
  if (el.dataset.armed === '1') { disarm(el, false); return true; }
  el.dataset.armed = '1';
  el._old = labelHtml || el.innerHTML;
  el.style.minWidth = el.offsetWidth + 'px';
  el.innerHTML = 'もう一度押して確定<small>Bấm lần nữa để xác nhận</small>';
  el.classList.add('armed');
  el._armT = setTimeout(() => disarm(el, true), 6000);
  return false;
}
function disarm(el, flush) {
  clearTimeout(el._armT);
  if (el.dataset.armed !== '1') return;
  el.dataset.armed = '';
  el.innerHTML = el._old;
  el.classList.remove('armed');
  el.style.minWidth = '';
  if (flush && S.pendingRender && !S.dirty) scheduleRender(); // hết hạn chờ: nếu dữ liệu đã đổi trong lúc chờ thì vẽ lại bây giờ (lần bấm 2 thì không — hành động tự vẽ lại / báo lỗi của nó)
}
document.addEventListener('submit', (e) => {
  const form = e.target;
  const act = form.dataset.action;
  if (!act || !ACTIONS[act]) return;
  e.preventDefault();
  if (form.hasAttribute('data-confirm')) { const b = form.querySelector('button:not([type=button])') || form.querySelector('button'); if (!armed(b)) return; }
  ACTIONS[act](form, new FormData(form));
});
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (btn) {
    e.preventDefault();
    if (btn.hasAttribute('data-confirm2') && !armed(btn)) return;
    if (CLICKS[btn.dataset.act]) CLICKS[btn.dataset.act](btn);
    return;
  }
  const cp = e.target.closest('[data-copy-from]');
  if (cp) {
    const el = document.getElementById(cp.dataset.copyFrom);
    if (el) {
      try { el.focus(); el.select(); el.setSelectionRange(0, String(el.value).length); } catch (_) { /* bỏ qua */ }
      const old = cp.dataset.old || cp.innerHTML; cp.dataset.old = old;
      const say = (t) => { cp.textContent = t; clearTimeout(cp._cpT); cp._cpT = setTimeout(() => { cp.innerHTML = old; }, 2500); };
      const fallback = () => { let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } say(ok ? 'コピーしました ✓' : '選択済み：長押し/Ctrl+C でコピー / Đã bôi đen — nhấn Ctrl+C'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(() => say('コピーしました ✓')).catch(fallback); else fallback();
    }
    return;
  }
  const tr = e.target.closest('tr[data-href]');
  if (tr && !e.target.closest('a,button,input,select,textarea')) go(tr.dataset.href);
});
document.addEventListener('input', (e) => { if (e.target.closest('form[data-keep]')) S.dirty = true; });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.matches('.chat-form textarea')) e.target.form.requestSubmit();
});
window.addEventListener('hashchange', () => {
  if (S.flash && S.flash.at) S.flash = null;
  S.dirty = false;
  S.recCode = null; // mã khôi phục chỉ hiện 1 lần: rời trang là xoá khỏi bộ nhớ
  if (S.tempCard && currentRoute().name !== 'accountCreated') S.tempCard = null; // mật khẩu vừa cấp chỉ hiện 1 lần: rời trang là xoá khỏi bộ nhớ
  render();
  window.scrollTo(0, 0);
});

// ===================== Khởi động =====================
function boot() {
  try {
    B = window.__DGW_BACKEND__ || firebaseBackend();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="card narrow center-card"><h1>接続エラー<small>Không tải được Firebase</small></h1><p>インターネット接続を確認して再読み込みしてください。<br>Kiểm tra mạng rồi tải lại trang.</p></div>';
    return;
  }
  render();
  B.onAuth((user) => { loadProfile(user); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

document.getElementById('ver').textContent = VERSION;
})();
</script>
</body></html>
