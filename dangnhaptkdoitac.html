:root{--green:#3fae6a;--pink:#ec6fa5;--orange:#f6b26b;--blue:#2c5fb3;--sky:#5bc7e0;--ink:#1f2933;--muted:#6b7785;--line:#e3e7ec;--bg:#f5f7fa;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:var(--blue)}
small{display:block;font-size:.72em;color:var(--muted);font-weight:normal}
h1 small,h2 small{display:inline;margin-left:.5em}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header.top{background:#fff;border-bottom:4px solid;border-image:linear-gradient(90deg,var(--green),var(--pink),var(--orange),var(--sky),var(--blue)) 1}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:700}
.brand img{height:36px}
.who{margin-left:auto;color:var(--muted);font-size:.9em;text-align:right;text-decoration:none}
a.who:hover{color:var(--ink)}
nav{display:flex;gap:4px;flex-wrap:wrap;width:100%}
nav a,nav .link{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.92em;background:none;border:0;cursor:pointer;font-family:inherit;text-align:center}
nav a:hover,nav .link:hover{background:var(--bg)}
nav a[aria-current=page]{background:#eef8f1;box-shadow:inset 0 -2px 0 var(--green)}
nav .badge.unread{padding:0 7px;font-size:.75em}
main{padding:24px 16px 48px;flex:1 0 auto;width:100%}
footer{border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:.8em;padding:16px 0}
footer .ver{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
.card>h2,.chat h2{font-size:1.05em;margin:0 0 12px}
.form h2{font-size:1.05em;border-left:4px solid var(--green);padding-left:8px;margin:24px 0 12px}
.form h2:first-of-type{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 20px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-weight:600;font-size:.92em;margin-bottom:4px}
.field em{color:#d64545;font-style:normal}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #cdd4dc;border-radius:6px;font:inherit;background:#fff}
input:disabled,input[readonly]{background:#f3f5f7;color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);border-color:transparent}
input[type=radio],input[type=checkbox]{width:auto}
.radios{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.radios label{border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;background:#fafbfc;flex:1 1 160px}
.radios label:has(input:checked){border-color:var(--green);background:#eef8f1}
.radios.big label{padding:14px 16px;font-weight:700;font-size:1.05em}
.radios.big .ico{font-size:1.3em;margin-right:4px}
.btn{display:inline-block;padding:9px 18px;border-radius:6px;border:1px solid #cdd4dc;background:#fff;color:var(--ink);text-decoration:none;cursor:pointer;font:inherit;text-align:center}
.btn.primary{background:linear-gradient(90deg,var(--green),#2f9a8a);color:#fff;border:0;font-weight:700}
.btn.primary small{color:rgba(255,255,255,.85)}
.btn.small{padding:4px 10px;font-size:.85em}
.btn.armed{background:#fde8ef;border-color:#d64545;color:#a52a5a}
.btn.primary.armed small{color:#a52a5a}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions{margin-top:16px;text-align:right}
.actions.stack{display:flex;flex-direction:column;gap:8px;text-align:left}
.actions.stack .btn{width:100%;text-align:left}
.inline{display:inline}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head h1{margin:.2em 0}
.flash{padding:12px 16px;border-radius:8px;margin-bottom:16px}
.flash.ok{background:#eaf7ee;border:1px solid #b8e2c5}
.flash.error{background:#fdecec;border:1px solid #f3c1c1}
.flash ul{margin:0;padding-left:20px}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:20px}
table.list{width:100%;border-collapse:collapse;font-size:.9em}
table.list th,table.list td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.list th{background:#f0f3f6;white-space:nowrap}
table.list tr[data-href]{cursor:pointer}
table.list tbody tr:hover{background:#f7fbff}
table.list .num,table.list th.num{text-align:right;white-space:nowrap}
td.wrapcell{min-width:180px;max-width:340px}
tr.inactive{opacity:.5}
table.detail{width:100%;border-collapse:collapse}
table.detail th{width:36%;text-align:left;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.detail td{padding:8px;border-bottom:1px solid var(--line);word-break:break-word}
table.detail td.big{font-size:1.4em;font-weight:700}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:20px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:#eceff3;font-size:.85em;white-space:nowrap;text-align:center;vertical-align:middle}
.badge small{display:block;font-size:.75em}
h1 .badge{font-size:.5em}
.st-new{background:#e7f0fd;color:#1d4f9c}.st-processing{background:#fff4e0;color:#9a5b00}.st-incomplete{background:#fde8ef;color:#a52a5a}
.st-done{background:#e5f6ea;color:#1f7a3f}.st-cancelled{background:#eceff3;color:#555}.st-clawback{background:#f1e8fb;color:#6b3fa0}.st-partner{background:#e3f4f8;color:#14707f}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0}
.stat{padding:12px 14px;border-radius:10px;text-decoration:none;color:inherit;font-size:.9em;border:2px solid transparent}
.stat b{display:block;font-size:1.8em;line-height:1.2}
a.stat:hover{filter:brightness(.97)}
a.stat.on{border-color:currentColor}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px}
.filters input,.filters select{width:auto;flex:1 1 150px}
.login{max-width:420px;margin:40px auto;text-align:center}
.login img{height:56px}
.login .form{text-align:left}
.login .btn{width:100%}
.narrow{max-width:520px}
.center-card{margin:24px auto}
.hint{color:var(--muted);font-size:.85em}
.warn{color:#b45309}
.neg{color:#c0392b}
.pre{white-space:pre-wrap}
.empty{color:var(--muted);text-align:center;padding:40px;background:#fff;border-radius:10px;border:1px dashed var(--line);margin-bottom:20px}
.history{list-style:none;padding:0;margin:0;font-size:.88em}
.history li{padding:6px 0;border-bottom:1px dashed var(--line)}
.history time{color:var(--muted);margin-right:6px}
.history .comment{background:#f7f9fb;border-radius:6px;padding:6px 8px;margin-top:4px}
.consent{display:block;margin:16px 0;padding:12px;background:#fafbfc;border:1px solid var(--line);border-radius:8px}
.consent input{width:auto;margin-right:6px}
[hidden]{display:none!important}
.cat{display:inline-block;font-weight:600;white-space:nowrap}
.cat-denki{color:#b7791f}.cat-gas{color:#c0392b}.cat-hikari{color:#2c5fb3}
.cond{white-space:pre-line;background:#fffaf0;border:1px solid #f6d9a8;border-radius:8px;padding:10px 12px;margin:0 0 14px;font-size:.88em}
.adminbox{margin-top:14px;padding:12px;border:1px dashed #c9daf6;border-radius:8px;background:#f7faff}
.pager{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
.pager a,.pager b{padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;text-decoration:none}
.pager b{background:var(--green);color:#fff;border-color:var(--green)}
.monthnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.monthnav input{width:auto}
.inlineform{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.inlineform .field{margin:0;flex:0 1 260px}
.inlineform .hint{flex-basis:100%;margin:0}
h2.sec{font-size:1.1em;margin:24px 0 10px}
small.bank{color:#555;font-size:.78em}small.bank.none{color:#b45309}
.copyrow{display:flex;gap:6px}
.copyrow input{flex:1;min-width:12.5em}
.ref-card{max-width:640px}
.rowact{white-space:nowrap}
.rowact .btn{margin:2px 0}
.rowact small.warn{display:block;white-space:normal;max-width:15em}
#bankBanner .btn{margin-left:6px}
.msgbox{width:100%;font-size:.88em;line-height:1.5;background:#f8fafc;white-space:pre-wrap;resize:vertical}
.copyrow .btn{white-space:nowrap}
.copyrow.full input{flex:1 1 100%;font-size:.92em}
.copyrow{flex-wrap:wrap}
.ref-card table.detail th{width:28%}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;font-size:1.05em}
.pwtoggle{margin-top:4px;font-size:.82em;color:var(--muted);display:flex;gap:6px;align-items:center}
.pwtoggle input{width:auto}
.checks{list-style:none;margin:0;padding:0}
.checks li{padding:8px 0 8px 28px;position:relative;border-bottom:1px dashed var(--line)}
.checks li:last-child{border-bottom:0}
.checks li::before{content:"✓";position:absolute;left:4px;top:8px;color:var(--green);font-weight:700}
.steps{margin:0;padding-left:20px}
.steps li{margin-bottom:10px}
.card code{background:#f0f3f6;border-radius:4px;padding:1px 6px;font-size:.9em}
.codebox{font-size:.76em;line-height:1.45;letter-spacing:0;white-space:pre;overflow:auto;resize:vertical;background:#f8fafc}
/* chat — theo nasonhome.online */
.chat-log{height:340px;overflow-y:auto;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.msg{margin:6px 0;display:flex;flex-direction:column;align-items:flex-start}
.msg.mine{align-items:flex-end}
.msg .meta{font-size:.72em;color:var(--muted)}
.msg .bubble{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px;max-width:85%}
.msg.mine .bubble{background:#e3f5ea;border-color:#bfe3cb}
.msg.system{align-items:center}.msg.system .bubble{background:none;border:0;color:var(--muted);font-size:.85em;text-align:center}
.msg.admin:not(.mine) .bubble{background:#e7f0fd;border-color:#c9daf6}
.chat-form{display:flex;gap:8px;align-items:stretch}
.chat-form textarea{flex:1}
.badge.unread{background:#d64545;color:#fff}
.chatwrap{display:grid;grid-template-columns:320px 1fr;gap:20px}
@media(max-width:800px){.chatwrap{grid-template-columns:1fr}}
.inbox{list-style:none;margin:0;padding:0}
.inbox li{border-bottom:1px solid var(--line)}
.inbox a{display:block;padding:10px 6px;text-decoration:none;color:inherit;border-radius:6px}
.inbox a:hover,.inbox a.on{background:#f7fbff}
.inbox small{margin-top:2px}
.inbox .snippet{color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){.who{display:none}h1{font-size:1.4em}}
@media(max-width:700px){header.top nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:2px}nav a,nav .link{padding:6px 2px;font-size:.84em;white-space:nowrap}nav small{font-size:.78em}}
@media(max-width:600px){.copyrow{flex-direction:column}.copyrow input{min-width:0}}
@media(max-width:700px){table.list th,table.list td{white-space:nowrap}table.list td.wrapcell{white-space:normal;min-width:200px}.stats{grid-template-columns:repeat(2,1fr)}}
/* bản 1 file (Firebase) */
.steps{margin:12px 0 14px;padding-left:22px}.steps li{margin:6px 0}
code{background:#f0f3f6;border-radius:4px;padding:1px 5px;font-size:.9em}
textarea.rules{font-size:.8em;white-space:pre;background:#f7f9fb;margin-top:8px}
/* bản f2: hợp đồng · xuất file · combo điện + gas */
.flash.warn{background:#fff8e6;border:1px solid #f3d38a}
.cat-set{color:#8e44ad}
.radios.big.cats label{flex:1 1 150px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 16px}
.exportbar{justify-content:flex-end;margin:-8px 0 12px}
.contract{max-width:860px;margin-left:auto;margin-right:auto;padding:36px 44px;line-height:1.75}
.k-title{font-size:1.5em;margin:0;border:0;padding:0}
.k-sub{font-weight:700;letter-spacing:.04em;margin:4px 0 10px;color:#334}
.k-head p{margin:0}
.k-sec{border-top:1px solid #d5dae0;margin-top:18px;padding-top:12px}
.k-sec h3{font-size:1.02em;margin:0 0 6px}
.k-sec h3 small{display:inline;font-size:.85em}
.k-sec ol{margin:0;padding-left:1.6em}
.k-sec li{margin:4px 0}
.k-sec i{color:#5a6573}
.k-parties{width:100%;border-collapse:collapse;margin-top:6px}
.k-parties th,.k-parties td{border-bottom:1px solid #e3e7ec;padding:8px;text-align:left;vertical-align:top}
.k-parties th{background:#f3f5f8;font-weight:600}
.k-parties small{display:inline}
.k-date{margin:10px 0}
.k-party{margin:14px 0;padding:10px 12px;background:#fafbfc;border:1px solid #edf0f3;border-radius:8px}
.k-signline{margin-top:6px;position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.k-inkan{position:relative;display:inline-block;min-width:64px;color:#8a94a0}
.k-seal{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:68px;height:68px;object-fit:contain;mix-blend-mode:multiply}
.k-sig{max-height:92px;max-width:240px;width:auto;height:auto;display:inline-block;vertical-align:middle;margin:2px 6px}
.k-blank{color:#a0a8b3;font-weight:normal}
.k-log{margin-top:10px;font-size:.78em;color:#6b7785;border-top:1px dashed #d5dae0;padding-top:6px}
.sigpad{display:block;width:100%;max-width:560px;height:250px;border:2px dashed #b9c3cf;border-radius:10px;background:#fff;cursor:crosshair;margin-bottom:8px}
.sigcap{margin:2px 0 8px}
.signform{max-width:860px;margin-left:auto;margin-right:auto}
.sealbox{width:120px;height:120px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:#fff}
.sealbox img{max-width:100px;max-height:100px}
button:disabled{opacity:.55;cursor:not-allowed}
button,.btn{touch-action:manipulation}
#busyov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(255,255,255,.92);z-index:1000;display:flex;align-items:center;justify-content:center;font-weight:700;color:#334}
#busyov div{padding:16px 24px;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.08)}
/* trang PDF (A4) — dựng tạm phía sau lớp phủ rồi chụp */
.pdfstage{position:absolute;left:0;top:0;z-index:-1;pointer-events:none}
.pdfpage{background:#fff;color:#1f2933;box-sizing:border-box;padding:52px 60px 28px;display:flex;flex-direction:column;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;margin-bottom:20px}
.pdfbody{flex:1 1 auto;overflow:hidden;min-height:0}
.pdffoot{flex:0 0 18px;font-size:10px;color:#8a94a0;text-align:center}
.pdf-contract .pdfbody{font-size:12.5px;line-height:1.7}
.pdf-contract .k-sec{margin-top:12px;padding-top:9px}
.pdf-contract .k-title{font-size:21px}
.pdf-list{padding:36px 40px 22px}
.pdf-list .pdfbody{font-size:10.5px;line-height:1.4}
.pdf-title{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.pdf-title img{height:30px}
.pdf-title b{font-size:17px}.pdf-title span{color:#6b7785;margin-left:6px}.pdf-title small{display:block;font-size:10px}
.pdf-cont{font-size:11px;color:#6b7785;margin-bottom:6px}
.pdftable{width:100%;border-collapse:collapse}
.pdftable th,.pdftable td{border:1px solid #d5dae0;padding:4px 6px;text-align:left;vertical-align:top}
.pdftable th{background:#eef1f5}
.pdftable small{display:block;font-size:9px;color:#6b7785}
.pdftable .num{text-align:right;white-space:nowrap}
.pdf-sum{margin-top:8px;font-weight:700;text-align:right}
@media(max-width:700px){.contract{padding:20px 16px}.k-seal{width:56px;height:56px}}
@media print{header.top,footer,.btns,.signform,.flash{display:none!important}.contract{border:0;padding:0}}
/* bản f3: kho lưu trữ tài khoản */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px;border-bottom:2px solid var(--line)}
.tabs a{padding:8px 16px;text-decoration:none;color:var(--muted);border-radius:8px 8px 0 0;border:1px solid transparent;margin-bottom:-2px}
.tabs a.on{background:#fff;color:var(--ink);font-weight:700;border-color:var(--line);border-bottom-color:#fff}
.tabs .badge{font-size:.75em;padding:0 8px;margin-left:2px}
tr.archived td{color:#5f6b78}
details.archive{padding:12px 16px}
details.archive summary{cursor:pointer;font-weight:700}
details.archive summary small{display:inline;margin-left:.5em}
details.archive .tablewrap{margin:12px 0 0}
.ngvn{border-color:#f3c1c1;background:#fff5f5}
.sealneed{border-color:#f3d38a;background:#fffdf5}
/* bản f6: xoá đơn → mục 削除済み */
.trashbanner{margin-bottom:16px}
.dangerzone{border-color:#f3c1c1}
.dangerzone h2{color:#a52a5a}
/* bản f5: ký trước khi dùng · lưu trữ hợp đồng */
.gatecard h2 small{display:block;margin:4px 0 0}
.vault h2{margin-bottom:10px}
.vault .tablewrap{margin-bottom:0}

/* Hộp thoại "hợp đồng đã tới" + trạng thái nhận hợp đồng */
.modal-bg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{max-width:470px;width:100%;margin:0;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.deliv{display:block;width:max-content;max-width:100%;margin:5px 0 0;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:600;line-height:1.35}
.head .deliv{display:inline-block;margin:0 0 0 10px;vertical-align:middle}
.deliv small{display:block;font-weight:400;font-size:10.5px;opacity:.85}
.deliv.ok{background:#e6f6ec;color:#146c2e}.deliv.wait{background:#fff4dc;color:#8a5a00}.deliv.err{background:#fde8e8;color:#b42318}

/* Link đăng nhập gửi đối tác */
.linkbtns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.linkstatus{margin:6px 0 10px;font-size:.92em}

.lk.ok{background:#e6f6ec;color:#146c2e}.lk.warn{background:#fff4dc;color:#7a4e00}.lk.err{background:#fde8e8;color:#b42318}.lk.wait{background:#eef1f5;color:#556}
#plink{font-size:.95em;word-break:break-all}
@media(max-width:700px){input,select,textarea{font-size:16px !important}}

.hp{position:absolute!important;left:-9999px;top:auto;width:1px;height:1px;opacity:0;overflow:hidden}
.ctvhead{margin:20px 0 16px}.ctvhead h1{margin:0 0 8px}
.ctvok{text-align:center}.ctvok h1{color:#1f7a3f}
.ctvstate{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}

.pwcell{display:flex;align-items:center;gap:4px}
.pwcell input{width:auto;min-width:0;max-width:13em;border:0;background:transparent;padding:2px 0;font-size:1em;color:var(--ink)}

    const host = String(l.hostname || '').toLowerCase();

const REC_ALPHA = '23456789ABCDEFGHJKMNPQRSTUVWXYZ'; // bỏ 0 O 1 I L cho khỏi nhầm
const REC_ITER = 310000;
const normRecCode = (s) => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');

function recSubtle() {

}

// Tạo bộ khôi phục mới cho MK pw → { code, rec } (rec chưa có at / setup_at)
async function recCreate(pw) {
  const sb = recSubtle();
  const code = randomChars(12, REC_ALPHA);
  const kp = await sb.generateKey({ name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' }, true, ['encrypt', 'decrypt']);
  const pub = b64e(await sb.exportKey('spki', kp.publicKey));
  const priv = await sb.exportKey('pkcs8', kp.privateKey);
  const salt = crypto.getRandomValues(new Uint8Array(16));

  const epriv = b64e(await sb.encrypt({ name: 'AES-GCM', iv }, key, priv));

// Giải MK hiện tại bằng mã khôi phục; sai mã → lỗi rec_bad_code
async function recDecryptPw(rec, code) {
  const sb = recSubtle();
  let priv;
  try {
    const key = await recKey(code, b64d(rec.salt), rec.iter);
    priv = await sb.decrypt({ name: 'AES-GCM', iv: b64d(rec.iv) }, key, b64d(rec.epriv));
  } catch (e) { throw Object.assign(new Error('rec_bad_code'), { code: 'rec_bad_code' }); }
  const pk = await sb.importKey('pkcs8', priv, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt']);

function randomChars(n, alphabet) {
  const c = (typeof crypto !== 'undefined' && crypto.getRandomValues) ? crypto : null;
  if (!c) throw new Error('crypto_unavailable');
  const max = Math.floor(256 / alphabet.length) * alphabet.length; // bỏ giá trị lệch để mỗi ký tự đều xác suất như nhau
  let out = '';
  while (out.length < n) {
    const buf = c.getRandomValues(new Uint8Array(n * 2));
    for (let i = 0; i < buf.length && out.length < n; i++) if (buf[i] < max) out += alphabet[buf[i] % alphabet.length];
  }
  return out;
}

  const needActual = range && o.company == null;
  const staffRate = Number(settings && settings.staff_rate != null ? settings.staff_rate : 0.5);
  const stockRate = Number(settings && settings.staff_stock_rate != null ? settings.staff_stock_rate : 0.5);
  const lostOp = !!(cat && cat.has_op) && opTaken === false;
  const company = Math.max(0, (f.company_fee || 0) - (f.deduction || 0) - (lostOp ? (f.op_fee || 0) : 0));
  let one = 0;
  let stock = 0;
  let pending = false;
  if (needActual) return { one: 0, stock: 0, company: 0, pending: role === 'staff' || role === 'partner', needActual: true };
  if (role === 'staff') {
    if (f.staff_fee != null && o.company == null) one = Math.max(0, f.staff_fee - (lostOp ? Math.floor((f.op_fee || 0) * staffRate) : 0));
    else one = Math.floor(company * staffRate);
    stock = f.staff_stock != null ? f.staff_stock : Math.floor((f.stock_monthly || 0) * stockRate);
  } else if (role === 'partner') {
    if (o.partner != null) one = o.partner;
    else if (f.partner_fee == null) pending = true;
    else one = Math.max(0, f.partner_fee - (lostOp ? (f.partner_op_fee || 0) : 0));
    stock = f.partner_stock || 0;
  }
  return { one, stock, company, pending };
}
function computeClawback(startedAt, cancelledAt, rewardAmount, fee) {
  if (!startedAt || !cancelledAt || !fee) return 0;
  const months = fee.clawback_months == null ? 6 : fee.clawback_months;
  const rate = Number(fee.clawback_rate || 0);
  if (rate <= 0) return 0;
  if (cancelledAt >= addMonths(startedAt, months)) return 0;
  return -Math.floor((rewardAmount || 0) * rate);
}

// Các dòng hoa hồng của 1 tháng từ danh sách đơn [{id, owner, form, state, company}]
function linesForMonth(apps, month) {
  const start = month + '-01';
  const end = nextMonth(month) + '-01';
  const lines = [];
  for (const a of apps) {
    const s = a.state || {};
    if (!DONE_LIKE.includes(s.status) || !s.started_at) continue;
    const base = { id: a.id, owner: a.owner, app_no: s.app_no, cust_name: (a.form || {}).cust_name, product_label: (a.form || {}).product_label };
    if (s.started_at >= start && s.started_at < end) lines.push({ ...base, type: 'one', amount: s.reward_amount || 0, pending: !!s.reward_pending, date: s.started_at, company: a.company || 0 });
    if ((s.reward_stock || 0) > 0 && s.started_at < end && (!s.cancelled_at || s.cancelled_at >= end)) lines.push({ ...base, type: 'stock', amount: s.reward_stock, date: month });
    if (s.status === 'clawback' && s.clawback_amount && s.cancelled_at >= start && s.cancelled_at < end) lines.push({ ...base, type: 'claw', amount: s.clawback_amount, date: s.cancelled_at });
  }
  return lines;
}
function totalsOf(lines) {
  const t = { count: 0, one: 0, stock: 0, claw: 0, total: 0, pending: 0, company_sum: 0 };
  for (const l of lines) {
    if (l.type === 'one') { t.count++; t.company_sum += l.company || 0; if (l.pending) { t.pending++; continue; } t.one += l.amount; }
    if (l.type === 'stock') t.stock += l.amount;
    if (l.type === 'claw') t.claw += l.amount;
  }
  t.total = t.one + t.stock + t.claw;
  return t;
}
const LINE_TYPE = { one: ['一時報酬', 'HH 1 lần'], stock: ['ストック', 'Stock tháng'], claw: ['戻入', 'Thu hồi'] };

// Kiểm tra form đơn → {d, errs}
function parseAppForm(fd, catalogList, opts) {
  const o = opts || {};
  const g = (k, m) => clean(fd.get(k), m);
  const errs = [];
  const d = {
    category: g('category', 10),
    product: g('product', 30),
    meigi_type: g('meigi_type', 10),
    cust_name: g('cust_name', 80),
    cust_kana: g('cust_kana', 80),
    company_name: g('company_name', 120),
    birth_date: g('birth_date', 10),
    phone: g('phone', 30),
    email: g('email', 120),
    postal: g('postal', 10).replace(/[^0-9]/g, ''),
    address: g('address', 200),
    building: g('building', 120),
    note: g('note', 2000),
    op_taken: fd.get('op_taken') === '1' ? true : fd.get('op_taken') === '0' ? false : null,
    owner_id: g('owner_id', 64),
    consent: fd.get('consent') === '1',
    details: {},
  };
  if (!CATEGORIES[d.category]) errs.push('種別を選択してください / Chọn loại dịch vụ');
  const p = catalogList.find((x) => x.code === d.product && (x.active || x.code === o.keepProduct));
  if (!p) errs.push('商材を選択してください / Chọn gói dịch vụ');
  else if (CATEGORIES[d.category] && p.category !== d.category) errs.push('商材と種別が一致しません / Gói không thuộc loại dịch vụ đã chọn');
  if (p && p.ng_vn) {
    if (fd.get('not_vn') !== '1') errs.push('この商材はベトナム国籍の方は取次できません。お客様がベトナム国籍でないことを確認してチェックしてください / Gói này KHÔNG nhận KH quốc tịch Việt Nam — tick xác nhận KH không phải người Việt Nam');
    else d.not_vn = true;
  }
  if (p && p.has_op && d.op_taken == null) errs.push('レ点オプションの加入有無を選択してください / Chọn KH có lấy gói OP hay không');
  if (p && !p.has_op) d.op_taken = null;
  if (!MEIGI[d.meigi_type]) errs.push('名義を選択してください / Chọn danh nghĩa');
  else if (p && !allowedMeigi(p).includes(d.meigi_type)) errs.push(`この商材は「${MEIGI[d.meigi_type].jp}」名義では申込できません / Gói này không nhận danh nghĩa ${MEIGI[d.meigi_type].vi}`);
  if (!d.cust_name) errs.push('契約者名を入力してください / Nhập tên khách hàng');
  if (!d.phone || !/^[0-9+\-() ]{8,20}$/.test(d.phone)) errs.push('電話番号を正しく入力してください / Số điện thoại không hợp lệ');
  if (!d.address) errs.push('住所を入力してください / Nhập địa chỉ');
  if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) errs.push('メールアドレスの形式が正しくありません / Email không hợp lệ');
  if (d.postal && d.postal.length !== 7) errs.push('郵便番号は7桁です / Mã bưu điện gồm 7 số');
  if (d.birth_date && !isYmd(d.birth_date)) errs.push('生年月日が正しくありません / Ngày sinh không hợp lệ');
  if (d.meigi_type === 'corp' && !d.company_name) errs.push('法人名を入力してください / Nhập tên công ty (danh nghĩa pháp nhân)');
  const lim = d.meigi_type === 'corp' ? null : ageLimits(p);
  if (lim) {
    if (!d.birth_date) errs.push(`生年月日を入力してください（${p.provider}は${lim[0]}〜${lim[1]}歳のみ）/ Nhập ngày sinh — ${p.provider} chỉ nhận KH ${lim[0]}–${lim[1]} tuổi`);
    else if (isYmd(d.birth_date)) {
      const age = ageAt(d.birth_date, today());
      if (age < lim[0] || age > lim[1]) errs.push(`${p.provider}は${lim[0]}〜${lim[1]}歳のみ（現在${age}歳）/ ${p.provider} chỉ nhận KH ${lim[0]}–${lim[1]} tuổi (KH đang ${age} tuổi)`);
    }
  }
  if (!d.consent) errs.push('お客様の同意確認にチェックしてください / Đánh dấu xác nhận đã có sự đồng ý của khách');
  if (o.needOwner && !d.owner_id) errs.push('担当者を選択してください / Chọn người được tính đơn');
  if (DETAIL_FIELDS[d.category]) {
    for (const [name, , , type, optList] of DETAIL_FIELDS[d.category]) {
      let v = clean(fd.get(`d_${d.category}_${name}`), 120);
      if (type === 'date' && v && !isYmd(v)) { errs.push('日付の形式が正しくありません / Ngày không hợp lệ'); v = ''; }
      if (type === 'select' && v && !optList.some((x) => x[0] === v)) v = '';
      if (v) d.details[name] = v;
    }
    if (p && p.no_switch && d.details.housing === 'switch') errs.push(`${p.provider}は契約切替（OSW）不可・新規入居のみ / ${p.provider} không nhận đổi hợp đồng (OSW), chỉ KH mới chuyển vào`);
    if ((d.category === 'denki' || d.category === 'set') && d.details.supply_point_no && !/^\d{22}$/.test(d.details.supply_point_no.replace(/[\s-]/g, ''))) {
      errs.push('供給地点特定番号は22桁の数字です / Mã điểm cấp điện gồm 22 chữ số');
    }
  }
  if (p) d.product_label = productLabel(p);
  return { d, p, errs };
}

// ---------- Thư viện ngoài (tải khi cần, từ cdnjs) ----------
const LIBS = {
  xlsx: ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', () => typeof XLSX !== 'undefined'],
  html2canvas: ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', () => typeof html2canvas !== 'undefined'],
  jspdf: ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', () => typeof window.jspdf !== 'undefined'],
};
async function ensureLib(name) {
  const [url, ok] = LIBS[name];
  if (ok()) return;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = url; s.onload = res; s.onerror = () => rej(new Error('load ' + url)); document.head.appendChild(s); });
}
function busyOverlay(on, text) {
  let el = document.getElementById('busyov');
  if (!on) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'busyov'; document.body.appendChild(el); }
  el.innerHTML = `<div>${h(text || '作成中… / Đang tạo file…')}</div>`;
}
async function xlsxDownload(filename, sheets) {
  await ensureLib('xlsx');
  const wb = XLSX.utils.book_new();
  for (const s of sheets) {
    const ws = XLSX.utils.aoa_to_sheet(s.rows.map((r) => r.map((v) => (v == null ? '' : v))));
    if (s.cols) ws['!cols'] = s.cols.map((w) => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, String(s.name).slice(0, 31));
  }
  XLSX.writeFile(wb, filename);
}

// PDF khổ A4: xếp các khối HTML vào từng trang (không cắt ngang dòng), rồi chụp từng trang
// o: { orientation, cls, label, blocks: [html] } hoặc { table: { before, head, rows: [html <tr>] } }
async function pdfDownload(filename, o) {
  busyOverlay(true, 'PDFを作成中… / Đang tạo PDF…');
  const stage = document.createElement('div');
  try {
    await ensureLib('html2canvas');
    await ensureLib('jspdf');
    const land = o.orientation === 'landscape';
    const W = land ? 1123 : 794;
    const H = land ? 794 : 1123;
    stage.className = 'pdfstage';
    document.body.appendChild(stage);
    const pages = [];
    const newPage = () => {
      const pg = document.createElement('div');
      pg.className = 'pdfpage ' + (o.cls || '');
      pg.style.width = W + 'px'; pg.style.height = H + 'px';
      const body = document.createElement('div'); body.className = 'pdfbody';
      const foot = document.createElement('div'); foot.className = 'pdffoot';
      pg.append(body, foot); stage.appendChild(pg); pages.push(pg);
      return body;
    };
    const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
    const over = (body) => body.scrollHeight > body.clientHeight + 1;
    let body = newPage();
    if (o.table) {
      const mk = (first) => {
        if (first && o.table.before) body.appendChild(el(o.table.before));
        if (!first && o.table.cont) body.appendChild(el(o.table.cont));
        const tb = el(`<table class="pdftable"><thead>${o.table.head}</thead><tbody></tbody></table>`);
        body.appendChild(tb);
        return tb.tBodies[0];
      };
      let tbody = mk(true);
      for (const r of o.table.rows) {
        const tr = el(`<table><tbody>${r}</tbody></table>`).querySelector('tr');
        tbody.appendChild(tr);
        if (over(body) && tbody.rows.length > 1) { tr.remove(); body = newPage(); tbody = mk(false); tbody.appendChild(tr); }
      }
      if (o.table.after) { const a = el(o.table.after); body.appendChild(a); if (over(body)) { a.remove(); body = newPage(); body.appendChild(a); } }
    } else {
      for (const b of o.blocks) {
        const e = el(b);
        body.appendChild(e);
        if (over(body) && body.children.length > 1) { e.remove(); body = newPage(); body.appendChild(e); }
      }
    }
    pages.forEach((pg, i) => { pg.querySelector('.pdffoot').textContent = `${o.label || ''}　${i + 1} / ${pages.length}`; });
    await Promise.all([...stage.querySelectorAll('img')].map((im) => (im.complete ? null : new Promise((r) => { im.onload = r; im.onerror = r; }))));
    const pdf = new window.jspdf.jsPDF({ orientation: land ? 'landscape' : 'portrait', unit: 'mm', format: 'a4', compress: true });
    for (let i = 0; i < pages.length; i++) {
      const canvas = await html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', logging: false, windowWidth: W + 40, scrollX: 0, scrollY: 0 });
      if (i) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, land ? 297 : 210, land ? 210 : 297);
    }
    pdf.save(filename);
  } finally {
    stage.remove();
    busyOverlay(false);
  }
}

// ---------- Ô ký tên: ký tay bằng ngón tay / chuột, đóng khung VÒNG TRÒN ĐỎ (kiểu 丸印) ----------
// Chữ ký được lưu dưới dạng các nét (toạ độ px) rồi vẽ lại; khi xuất PNG: vòng tròn đỏ (2 lớp viền) + nét ký, nền trong suốt, vuông 320×320.
// Vòng tròn mặc định nằm giữa ô; nếu nét ký vượt ra ngoài thì vòng tròn tự nới rộng cho ôm trọn chữ ký.
const SIG_INK = '#14213d';
const SIG_RED = '#d62828';
const SIG_LW = 3;
function sigDrawRing(c, ring, alpha, dashed, w) {
  const lw = w || 4.2;
  c.save();
  c.globalAlpha = alpha; c.strokeStyle = SIG_RED; c.lineJoin = 'round';
  if (dashed) c.setLineDash([9, 6]);
  c.lineWidth = lw; c.beginPath(); c.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2); c.stroke();
  c.setLineDash([]);
  c.lineWidth = lw / 3; c.beginPath(); c.arc(ring.x, ring.y, Math.max(2, ring.r - 7), 0, Math.PI * 2); c.stroke();
  c.restore();
}
function sigDrawStroke(c, pts, lw) {
  if (!pts.length) return;
  c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = SIG_INK; c.fillStyle = SIG_INK;
  if (pts.length < 3) {
    if (pts.length === 1 || (pts[0].x === pts[1].x && pts[0].y === pts[1].y)) { c.beginPath(); c.arc(pts[0].x, pts[0].y, lw * 0.55, 0, Math.PI * 2); c.fill(); return; }
    c.beginPath(); c.moveTo(pts[0].x, pts[0].y); c.lineTo(pts[1].x, pts[1].y); c.stroke(); return;
  }
  c.beginPath(); c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++) { const m = { x: (pts[i].x + pts[i + 1].x) / 2, y: (pts[i].y + pts[i + 1].y) / 2 }; c.quadraticCurveTo(pts[i].x, pts[i].y, m.x, m.y); }
  const l = pts[pts.length - 1]; c.lineTo(l.x, l.y); c.stroke();
}
function initSigPad(canvas, onStart) {
  const ctx = canvas.getContext('2d');
  let strokes = []; // mỗi nét = mảng điểm {x,y}
  let cur = null; let W = 0; let H = 0;
  const base = () => ({ x: W / 2, y: H / 2, r: Math.max(30, Math.min(W, H) / 2 - 8) });
  // Vòng tròn thực tế: mặc định ở giữa ô; nét ký vượt ra ngoài → ôm trọn chữ ký
  const fit = () => {
    const g = base();
    const pts = strokes.flat();
    if (!pts.length) return g;
    const m = SIG_LW / 2 + 5;
    if (pts.every((p) => Math.hypot(p.x - g.x, p.y - g.y) <= g.r - m - 7)) return g;
    const xs = pts.map((p) => p.x); const ys = pts.map((p) => p.y);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2; const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    return { x: cx, y: cy, r: Math.max(40, Math.max(...pts.map((p) => Math.hypot(p.x - cx, p.y - cy))) + m + 9) };
  };
  const paint = () => {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore();
    sigDrawRing(ctx, base(), 0.55, true);
    strokes.forEach((s) => sigDrawStroke(ctx, s, SIG_LW));
  };
  const setup = () => {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paint();
  };
  setup();
  // Xoay màn hình / bàn phím ảo làm đổi kích thước: vẽ lại, KHÔNG mất chữ ký đã ký
  const onResize = () => {
    if (!canvas.isConnected) { window.removeEventListener('resize', onResize); return; }
    const r = canvas.getBoundingClientRect();
    if (Math.abs(r.width - W) > 1 || Math.abs(r.height - H) > 1) setup();
  };
  window.addEventListener('resize', onResize);
  const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.style.touchAction = 'none';
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* bỏ qua */ }
    cur = [pos(e)]; strokes.push(cur); paint();
    if (onStart) onStart();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!cur) return;
    const p = pos(e); const l = cur[cur.length - 1];
    if (Math.hypot(p.x - l.x, p.y - l.y) < 0.6) return;
    cur.push(p); paint();
  });
  const end = () => { cur = null; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end); canvas.addEventListener('pointerleave', end);
  return {
    isEmpty: () => strokes.reduce((n, s) => n + Math.max(0, s.length - 1), 0) < 4,
    clear: () => { strokes = []; cur = null; paint(); },
    // PNG vuông 320×320, nền trong suốt: vòng tròn đỏ + chữ ký tay
    toPng() {
      if (!strokes.length) return '';
      const ring = fit();
      const D = 2 * (ring.r + 6);
      const OUT = 320; const k = OUT / D;
      const out = document.createElement('canvas');
      out.width = OUT; out.height = OUT;
      const o = out.getContext('2d');
      o.setTransform(k, 0, 0, k, -(ring.x - D / 2) * k, -(ring.y - D / 2) * k);
      sigDrawRing(o, ring, 1, false, Math.max(4.2, 4.6 / k));
      strokes.forEach((s) => sigDrawStroke(o, s, Math.min(6 / k, Math.max(SIG_LW * 1.25, 3.6 / k))));
      return out.toDataURL('image/png');
    },
  };
}

// Ảnh con dấu công ty: thu nhỏ ≤ 240px, nền trắng → trong suốt
function processSeal(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 240 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const im = ctx.getImageData(0, 0, c.width, c.height);
      for (let i = 0; i < im.data.length; i += 4) if (im.data[i] > 225 && im.data[i + 1] > 225 && im.data[i + 2] > 225) im.data[i + 3] = 0;
      ctx.putImageData(im, 0, 0);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めません / Không đọc được ảnh')); };
    img.src = url;
  });
}

function setFlash(type, msg) { S.flash = { type, msg }; }

function sub(path, key, wrapOwner, onChange) {

// ---- Hợp đồng: đối tác nhận được chưa? ----
// Đối tác không đọc được hợp đồng (thường do Rules Firebase chưa cập nhật) → báo rõ cho đối tác, tự thử lại mỗi 20 giây
// (admin dán Rules xong là tự nhận, không cần tải lại), và để lại dấu ở dgw/reads/<uid>/contract_err cho quản trị biết.
function onContractsDenied() {
  clearTimeout(S.retryT);
  S.retryT = setTimeout(retryContracts, 20000);
}
function retryContracts() {
  if (!S.me || !isPartner()) return;
  sub(`${P.contracts}/${uid()}`, 'contracts', true, onContractsChange);
  sub(`${P.contractArchive}/${uid()}`, 'contractArchive', true);
}
function onContractsChange() { syncContractFlags(); scheduleRender(); }
// Đối tác tự ghi dấu (dgw/reads/<uid> — nhánh Rules cho phép từ trước): "đã nhận hợp đồng phát hành lúc <issued_at>" / "bị chặn đọc".
// Quản trị đọc các dấu này để hiện 📬 受信済 / ⚠ 受信不可 — biết chắc đối tác đã nhận hay chưa.
function syncContractFlags() {
  if (!S.me || !isPartner() || !S.loaded.reads || !S.loaded.contracts) return;
  const upd = {};
  const me = uid();
  const rd = S.reads || {};
  if (S.subErr.contracts) {
    if (!S.errSent && !rd.contract_err) { S.errSent = true; upd[`${P.reads}/${me}/contract_err`] = { at: B.TS, code: S.subErr.contracts }; }
  } else {
    if (rd.contract_err) upd[`${P.reads}/${me}/contract_err`] = null;
    const c = myContract();
    if (c && c.status === 'sent' && c.issued_at && S.rcptSent !== c.issued_at && !(rd.contract && rd.contract.iss === c.issued_at)) {
      S.rcptSent = c.issued_at;
      upd[`${P.reads}/${me}/contract`] = { iss: c.issued_at, at: B.TS };
    }
  }
  if (Object.keys(upd).length) B.update(upd).catch(() => { S.rcptSent = null; S.errSent = false; });
}
// Quản trị: tình trạng giao hợp đồng cho từng đối tác
function deliveryOf(id) {
  const c = (S.contracts || {})[id];
  if (!c || c.status !== 'sent') return null;
  const r = (S.readsAll || {})[id] || {};
  if (r.contract && c.issued_at && r.contract.iss === c.issued_at) return { ok: true, at: r.contract.at };
  if (r.contract_err) return { err: true, at: r.contract_err.at };
  return { wait: true };
}
function deliveryBadge(id) {
  const d = deliveryOf(id);
  if (!d) return '';
  if (d.ok) return `<span class="deliv ok">📬 受信済 ${h(fmtTime(d.at))}<small>Đối tác đã nhận hợp đồng</small></span>`;
  if (d.err) return '<span class="deliv err">⚠ 受信不可<small>Đối tác bị chặn đọc (Rules) — dán lại Rules</small></span>';
  return '<span class="deliv wait">⏳ 未受信<small>Chưa nhận — đối tác chưa mở hệ thống</small></span>';
}
function blockedPartners() {
  return Object.entries(S.readsAll || {}).filter(([id, r]) => r && r.contract_err && (S.users[id] || {}).role === 'partner' && (S.users[id] || {}).active !== false).map(([id]) => id);
}

// Hồ sơ của chính mình luôn được theo dõi: bị khoá → mất quyền ngay; được khôi phục → tự vào lại, không cần tải lại trang
function subscribeAll() {

    const was = S.me;
    // Bản cũ từng bắt đổi mật khẩu ở lần đăng nhập đầu: nay không còn ép — tự gỡ cờ cũ (Rules cho phép tự đặt false)
    if (v.must_change_pw === true) B.update({ [`${P.users}/${me}/must_change_pw`]: false }).catch(() => {});
    S.me = { uid: me, ...v };

  for (const [owner] of Object.entries(S.chatDm || {})) {
    const msgs = threadMsgs('dm', owner);
    if (!msgs.length) continue;
    out.push({ kind: 'dm', owner, msgs, key: threadKey('dm', owner), title: isAdmin() ? `💬 ${userName(owner)}` : 'NASON へのお問い合わせ', subtitle: isAdmin() ? '個別チャット / Chat riêng' : 'Hỏi đáp chung', href: isAdmin() ? `#/chat/dm/${owner}` : '#/chat' });
  }
  out.forEach((t) => { t.unread = unreadCount(t.msgs, t.key); t.last = t.msgs[t.msgs.length - 1]; });
  return out.sort((a, b) => (b.last.at || 0) - (a.last.at || 0));
}
function totalUnread() { return allThreads().reduce((s, t) => s + t.unread, 0); }

// ===================== Router =====================
function currentRoute() {
  const raw = (location.hash || '#/').slice(1) || '/';
  const [path, query] = raw.split('?');
  const q = new URLSearchParams(query || '');
  const p = path.replace(/\/+$/, '') || '/';
  const m = (re) => p.match(re);
  let r;
  if (p === '/') r = { name: 'list' };
  else if (p === '/apply') r = { name: 'apply' };
  else if ((r = m(/^\/apps\/([^/]+)\/([^/]+)\/edit$/))) r = { name: 'edit', owner: r[1], id: r[2] };
  else if ((r = m(/^\/apps\/([^/]+)\/([^/]+)$/))) r = { name: 'detail', owner: r[1], id: r[2] };
  else if (p === '/rewards') r = { name: 'rewards' };
  else if (p === '/chat') r = { name: 'chat' };
  else if ((r = m(/^\/chat\/dm\/([^/]+)$/))) r = { name: 'chatdm', owner: r[1] };
  else if (p === '/account') r = { name: 'account' };
  else if (p === '/account/password') r = { name: 'password' };
  else if (p === '/setup') r = { name: 'setup' };
  else if (p === '/admin/rewards') r = { name: 'arewards' };
  else if ((r = m(/^\/admin\/rewards\/([^/]+)$/))) r = { name: 'arewardsPerson', owner: r[1] };
  else if (p === '/admin/products') r = { name: 'products' };
  else if (p === '/admin/products/new') r = { name: 'productNew' };
  else if ((r = m(/^\/admin\/products\/([^/]+)$/))) r = { name: 'product', code: decodeURIComponent(r[1]) };
  else if (p === '/admin/accounts') r = { name: 'accounts' };
  else if (p === '/admin/accounts/new') r = { name: 'accountNew' };
  else if (p === '/admin/accounts/created') r = { name: 'accountCreated' };
  else if ((r = m(/^\/admin\/accounts\/([^/]+)$/))) r = { name: 'accountDetail', id: r[1] };
  else if (p === '/admin/audit') r = { name: 'audit' };
  else if (p === '/contract') r = { name: 'contract' };
  else if (p === '/admin/contracts') r = { name: 'acontracts' };
  else if ((r = m(/^\/admin\/contracts\/([^/]+)$/))) r = { name: 'acontract', id: r[1] };
  else if (p === '/admin/rules') r = { name: 'arules' };
  else if ((r = m(/^\/ctv\/([^/]+)\/([^/]+)$/))) r = { name: 'ctv', owner: r[1], token: r[2] };
  else r = { name: 'notfound' };
  r.q = q;
  r.path = p;
  return r;
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

function viewFor(r) {
  if (r.name === 'ctv') return V.ctv(r); // trang công khai cho CTV: không cần đăng nhập, không chờ dữ liệu của tài khoản

  if (!S.auth) return r.name === 'setup' ? V.setupStart() : V.login(r.q.get('forgot') === '1', r.q.get('email'));
  if (r.name === 'setup') return V.setupRules();
  if (!S.me) return V.noAccess();
  // Đối tác: KHÔNG còn bị chặn bởi hợp đồng — dùng hệ thống ngay sau khi đăng nhập; chỉ hiện thanh nhắc ký hợp đồng (xem render)
  const needAdmin = ['arewards', 'arewardsPerson', 'products', 'product', 'productNew', 'accounts', 'accountNew', 'accountCreated', 'accountDetail', 'audit', 'chatdm', 'acontracts', 'acontract', 'arules'];
  if (r.name === 'contract' && !isPartner()) return isAdmin() ? (setTimeout(() => go('#/admin/contracts'), 0), '') : V.error('403', '権限がありません', 'Trang này dành cho đối tác.');
  if (needAdmin.includes(r.name) && !isAdmin()) return V.error('403', '権限がありません', 'Bạn không có quyền vào trang này.');
  const wait = isAdmin() ? ['apps', 'catalog', 'users', 'apptrash'] : ['apps', 'catalog'];
  if (['contract', 'acontracts', 'acontract'].includes(r.name)) wait.push('contracts');
  if (wait.some((k) => !S.loaded[k])) return '<div class="empty">読み込み中… / Đang tải dữ liệu…</div>';
  switch (r.name) {
    case 'list': return V.list(r);
    case 'apply': return V.apply(null, r);
    case 'edit': { const a = findApp(r.owner, r.id); if (!a) return V.notFound(); return V.apply(a, r); }
    case 'detail': { const a = findApp(r.owner, r.id) || (isAdmin() ? findTrashed(r.owner, r.id) : null); if (!a) return V.notFound(); return V.detail(a); }
    case 'rewards': if (isAdmin()) { setTimeout(() => go('#/admin/rewards'), 0); return ''; } return V.rewards(r);
    case 'chat': return V.chat(null);
    case 'chatdm': return V.chat(r.owner);
    case 'account': return V.account();
    case 'password': return V.password();
    case 'arewards': return V.adminRewards(r);
    case 'arewardsPerson': return V.adminRewardsPerson(r);
    case 'products': return V.products();
    case 'productNew': return V.productEdit(null);
    case 'product': return V.productEdit(r.code);
    case 'accounts': return V.accounts(r);
    case 'accountNew': return V.accountNew();
    case 'accountCreated': return V.accountCreated();
    case 'accountDetail': { const u = S.users[r.id]; if (!u) return V.notFound(); if (vaultOk(r.id, u) && S.vault[r.id] === undefined) { S.vault[r.id] = 'loading'; setTimeout(() => loadVault(r.id), 0); } return V.accountDetail(r.id, u); }
    case 'audit': return V.audit();
    case 'contract': return V.contract();
    case 'acontracts': return V.adminContracts(r);
    case 'acontract': { const u = S.users[r.id]; if (!u) return V.notFound(); return V.adminContract(r.id, u); }
    case 'arules': return V.rulesUpdate();
    default: return V.notFound();
  }
}

          <label class="field"><span>新しいパスワード（確認）<small>Nhập lại mật khẩu mới</small></span><input name="password2" type="password" required autocomplete="new-password"></label>

    return `<div class="login card"><img src="${LOGO}" alt="NASON HOME"><h1>ログイン<small>Đăng nhập</small></h1>
      <p class="hint">電気・ガス・光回線 申込システム<br>Hệ thống đăng ký Điện · Gas · Wifi</p>${inApp}
      <form class="form" data-action="login">
        <label class="field"><span>メールアドレス<small>Email đăng nhập</small></span><input name="email" type="email" required${em ? '' : ' autofocus'} autocomplete="username" autocapitalize="none" autocorrect="off" inputmode="email" spellcheck="false" value="${h(em)}"></label>
        <label class="field"><span>パスワード<small>Mật khẩu</small></span><input name="password" type="password" required${em ? ' autofocus' : ''} autocomplete="current-password" autocapitalize="none" autocorrect="off"></label>
        <button class="btn primary">ログイン / Đăng nhập</button>

      <p class="hint"><a href="#/?forgot=1">パスワードを忘れた / Quên mật khẩu</a> · <a href="#/setup">初期設定 / Thiết lập lần đầu</a></p></div>`;
  },

  setupStart() {
    return `<div class="card narrow center-card"><h1>初期設定<small>Thiết lập lần đầu — tạo tài khoản tổng nason kanri</small></h1>
      <p class="hint">最初の1回だけ。管理者（nason kanri）のアカウントを作成します。<br>Chỉ làm 1 lần: tạo tài khoản quản trị tổng.</p>

        <label class="field"><span>パスワード<small>Mật khẩu (≥ 8 ký tự)</small></span><input name="password" type="password" required autocomplete="new-password" data-pwtoggle></label>

  setupRules() {
    const id = uid();
    if (S.me && S.me.is_owner) return `<div class="card narrow center-card"><h1>✅ 設定済み<small>Đã thiết lập xong</small></h1><p><a class="btn primary" href="#/">申込一覧へ / Vào hệ thống</a></p></div>`;
    const snippet = RULES_TEMPLATE.replace(/__OWNER_UID__/g, id);
    return `<div class="card center-card" style="max-width:860px"><h1>初期設定 2/2<small>Dán Rules vào Firebase rồi bấm Hoàn tất</small></h1>
      <table class="detail"><tr><th>ログイン中<small>Đang đăng nhập</small></th><td><b>${h(S.auth.email)}</b></td></tr><tr><th>UID</th><td class="mono">${h(id)}</td></tr></table>

      <form data-action="setupFinish" class="form"><div class="actions"><button class="btn" type="button" data-act="logout">ログアウト / Đăng xuất</button> <button class="btn primary">完了 / Hoàn tất</button></div></form></div>`;
  },

  noAccess() {
    const reason = S.noAccess === 'locked' ? 'このアカウントは停止されています / Tài khoản đã bị khoá — liên hệ NASON.'
      : S.noAccess === 'rules' ? 'データベースの権限がありません（初期設定が未完了の可能性）/ Chưa có quyền truy cập (có thể chưa thiết lập xong).'
